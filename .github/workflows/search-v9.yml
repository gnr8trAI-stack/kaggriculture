name: search-v9

on:
  pull_request:
    branches: [main]
    paths:
      - 'agents/v9_portfolio_optimizer.py'
      - 'agents/melon_baseline.py'
      - 'scripts/search_v9_parameters.py'
      - 'tests/test_v9_portfolio_optimizer.py'
      - '.github/workflows/search-v9.yml'
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Run focused tests
        run: python -m pytest -q tests/test_v9_portfolio_optimizer.py
      - name: Search V9 parameters
        run: python -m scripts.search_v9_parameters --seeds-per-seat 2 --output experiments/v9-parameter-search.json
      - name: Enforce safety only during search
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('experiments/v9-parameter-search.json').read_text())
          best = report['best']
          assert best['summary']['invalid_or_error_games'] == 0, best
          print(json.dumps(best, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v9-parameter-search
          path: experiments/v9-parameter-search.json
          if-no-files-found: warn
