name: benchmark-v6

on:
  pull_request:
    branches: [main]
    paths:
      - 'agents/**'
      - 'scripts/benchmark*.py'
      - 'tests/**'
      - '.github/workflows/benchmark-v6.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Run V6 against frozen V2
        run: python -m scripts.benchmark_v6 --games-per-seat 10 --output experiments/v6-seed-throughput-vs-v2-20.json
      - name: Enforce runtime safety gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('experiments/v6-seed-throughput-vs-v2-20.json').read_text())
          summary = report['summary']
          assert summary['invalid_or_error_games'] == 0, summary
          print(json.dumps({**summary, 'seat_mean_delta': report['seat_mean_delta']}, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v6-seed-throughput-benchmark
          path: experiments/v6-seed-throughput-vs-v2-20.json
          if-no-files-found: warn
