name: adaptive-replay-lab

on:
  push:
    branches:
      - agent/adaptive-replay-lab-final
  pull_request:
    paths:
      - 'trainer/**'
      - 'adaptive_lab/**'
      - 'scripts/benchmark_adaptive_population.py'
      - '.github/workflows/adaptive-replay-lab.yml'
  workflow_dispatch:

jobs:
  validate-adaptive-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Preflight repository paths
        run: |
          test -f agents/adaptive_agent.py
          test -f agents/v2_frozen.py
          test -f trainer/harvest_kaggle_replays.py
          test -f trainer/ingest_replays.py
          test -f trainer/build_route_library.py
          test -f trainer/generate_adaptive_agent.py
          test -f scripts/benchmark_adaptive_population.py
          echo 'Configured agent and tooling paths exist'
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kaggle-environments kaggle
      - name: Compile adaptive tooling
        run: |
          python -m py_compile trainer/harvest_kaggle_replays.py
          python -m py_compile trainer/ingest_replays.py
          python -m py_compile trainer/build_route_library.py
          python -m py_compile trainer/generate_adaptive_agent.py
          python -m py_compile scripts/benchmark_adaptive_population.py
      - name: Verify repository benchmark import
        run: |
          python - <<'PY'
          from scripts.benchmark import _run_game, summarize
          assert callable(_run_game)
          assert callable(summarize)
          print('benchmark harness import OK')
          PY

  harvest-train-build:
    needs: validate-adaptive-tooling
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Reclaim runner disk space
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          sudo apt-get clean || true
          df -h /
      - name: Install Kaggle and simulator
        run: |
          python -m pip install --upgrade pip
          pip install kaggle kaggle-environments
      - name: Verify Kaggle authentication secret
        run: |
          test -n "$KAGGLE_API_TOKEN"
          echo 'Kaggle token is configured'
      - name: Harvest public Kaggriculture replay datasets
        run: |
          python trainer/harvest_kaggle_replays.py --output raw_kaggle_replays
          df -h /
      - name: Ingest and split replay corpus
        run: |
          python trainer/ingest_replays.py --input raw_kaggle_replays --output replay_db
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('replay_db/summary.json').read_text())
          assert s['unique_episodes'] > 0, s
          assert s['trajectory_rows'] >= 2, s
          assert s['families'] > 0, s
          assert s.get('identity_coverage',0) >= 0.95, s
          assert s.get('fit_rows',0) > 0, s
          print(json.dumps(s, indent=2))
          PY
      - name: Build replay route library
        run: |
          python trainer/build_route_library.py --corpus replay_db --output artifacts/route_library.json --max-routes-per-strategy 5
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/route_library.json').read_text())
          r=d.get('routes') or []
          assert r, 'No fit-window winning routes were produced'
          print('routes',len(r),'strategies',sorted({x['strategy'] for x in r}))
          PY
      - name: Generate standalone adaptive agent
        run: |
          python trainer/generate_adaptive_agent.py --routes artifacts/route_library.json --fallback agents/adaptive_agent.py --output dist/main.py
          python -m py_compile dist/main.py
          ! grep -Eq 'from trainer|import trainer|from agents|import agents|from scripts|import scripts' dist/main.py
      - name: Import generated submission
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('dist/main.py')
          spec=importlib.util.spec_from_file_location('adaptive_submission',p)
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          assert callable(mod.agent)
          print('standalone agent import OK',p.stat().st_size)
          PY
      - name: Smoke test generated agent versus starter
        run: |
          python - <<'PY'
          import importlib.util
          from kaggle_environments import make
          spec=importlib.util.spec_from_file_location('submission','dist/main.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          env=make('kaggriculture',configuration={'episodeSteps':720},debug=True)
          env.run([mod.agent,'starter'])
          final=env.state
          print([(s.reward,str(s.status)) for s in final])
          assert str(final[0].status) not in {'ERROR','INVALID','TIMEOUT'}
          PY
      - name: Benchmark generated agent against repository population
        run: |
          python scripts/benchmark_adaptive_population.py \
            --candidate dist/main.py \
            --opponent v2_frozen=agents/v2_frozen.py \
            --opponent adaptive_baseline=agents/adaptive_agent.py \
            --games-per-seat 4 \
            --seed-start 620000 \
            --output artifacts/adaptive_population_results.csv
          python - <<'PY'
          import csv
          from pathlib import Path
          rows=list(csv.DictReader(Path('artifacts/adaptive_population_results.csv').open()))
          assert rows
          invalid=sum(r['candidate_status'] in {'ERROR','INVALID','TIMEOUT'} for r in rows)
          wins=sum(r['result']=='win' for r in rows); losses=sum(r['result']=='loss' for r in rows); ties=sum(r['result']=='tie' for r in rows)
          mean_delta=sum(float(r['delta']) for r in rows)/len(rows)
          print({'games':len(rows),'wins':wins,'losses':losses,'ties':ties,'invalid':invalid,'mean_delta':mean_delta})
          assert invalid == 0
          PY
      - name: Build Kaggle root-level submission ZIP
        run: |
          rm -f submission.zip
          (cd dist && zip -j ../submission.zip main.py)
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('submission.zip') as z:
              names=z.namelist()
              print('submission contents',names)
              assert names == ['main.py'], names
          PY
      - name: Build provenance report
        run: |
          python - <<'PY'
          import hashlib,json,csv
          from pathlib import Path
          harvest=json.loads(Path('raw_kaggle_replays/harvest_summary.json').read_text())
          corpus=json.loads(Path('replay_db/summary.json').read_text())
          routes=json.loads(Path('artifacts/route_library.json').read_text()).get('routes') or []
          rows=list(csv.DictReader(Path('artifacts/adaptive_population_results.csv').open()))
          agent=Path('dist/main.py')
          bench={'games':len(rows),'wins':sum(r['result']=='win' for r in rows),'losses':sum(r['result']=='loss' for r in rows),'ties':sum(r['result']=='tie' for r in rows),'invalid':sum(r['candidate_status'] in {'ERROR','INVALID','TIMEOUT'} for r in rows),'mean_delta':sum(float(r['delta']) for r in rows)/len(rows)}
          report={'generation':2,'harvest':harvest,'corpus':corpus,'routes':len(routes),'route_strategies':sorted({r['strategy'] for r in routes}),'fallback':'agents/adaptive_agent.py','population_benchmark':bench,'agent_bytes':agent.stat().st_size,'agent_sha256':hashlib.sha256(agent.read_bytes()).hexdigest(),'submission_zip_sha256':hashlib.sha256(Path('submission.zip').read_bytes()).hexdigest(),'kaggle_root_entry':'main.py'}
          Path('artifacts/build_report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Upload generation 2 candidate
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-kaggriculture-agent-gen2
          path: |
            submission.zip
            dist/main.py
            artifacts/route_library.json
            artifacts/build_report.json
            artifacts/adaptive_population_results.csv
            replay_db/index.csv
            replay_db/summary.json
            raw_kaggle_replays/harvest_summary.json
          retention-days: 14
