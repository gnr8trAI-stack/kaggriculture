name: adaptive-replay-lab

on:
  push:
    branches:
      - agent/adaptive-replay-lab-final
  pull_request:
    paths:
      - 'trainer/**'
      - 'adaptive_lab/**'
      - 'scripts/benchmark_adaptive_population.py'
      - '.github/workflows/adaptive-replay-lab.yml'
  workflow_dispatch:

jobs:
  validate-adaptive-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kaggle-environments kaggle
      - name: Compile adaptive tooling
        run: |
          python -m py_compile trainer/harvest_kaggle_replays.py
          python -m py_compile trainer/ingest_replays.py
          python -m py_compile trainer/build_route_library.py
          python -m py_compile trainer/generate_adaptive_agent.py
          python -m py_compile scripts/benchmark_adaptive_population.py
      - name: Verify repository benchmark import
        run: |
          python - <<'PY'
          from scripts.benchmark import _run_game, summarize
          assert callable(_run_game)
          assert callable(summarize)
          print('benchmark harness import OK')
          PY

  harvest-train-build:
    needs: validate-adaptive-tooling
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Reclaim runner disk space
        shell: bash
        run: |
          echo 'Disk before cleanup:'
          df -h /
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          sudo apt-get clean || true
          echo 'Disk after cleanup:'
          df -h /
      - name: Install Kaggle and simulator
        run: |
          python -m pip install --upgrade pip
          pip install kaggle kaggle-environments
      - name: Verify Kaggle authentication secret
        shell: bash
        run: |
          test -n "$KAGGLE_API_TOKEN"
          echo "Kaggle token is configured"
      - name: Harvest public Kaggriculture replay datasets
        run: |
          python trainer/harvest_kaggle_replays.py --output raw_kaggle_replays
          echo 'Disk after harvest:'
          df -h /
      - name: Ingest and split replay corpus
        run: |
          python trainer/ingest_replays.py --input raw_kaggle_replays --output replay_db
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('replay_db/summary.json').read_text())
          assert summary['unique_episodes'] > 0, summary
          assert summary['trajectory_rows'] >= 2, summary
          assert summary['families'] > 0, summary
          assert summary.get('identity_coverage', 0) >= 0.95, summary
          assert summary.get('fit_rows', 0) > 0, summary
          print(json.dumps(summary, indent=2))
          PY
          echo 'Disk after ingest:'
          df -h /
      - name: Build replay route library
        run: |
          python trainer/build_route_library.py \
            --corpus replay_db \
            --output artifacts/route_library.json \
            --max-routes-per-strategy 5
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('artifacts/route_library.json').read_text())
          routes=data.get('routes') or []
          assert routes, 'No fit-window winning routes were produced'
          print('routes', len(routes))
          print('strategies', sorted({r['strategy'] for r in routes}))
          PY
      - name: Generate standalone adaptive agent
        run: |
          python trainer/generate_adaptive_agent.py \
            --routes artifacts/route_library.json \
            --fallback agents/v11_agent.py \
            --output dist/main.py
          python -m py_compile dist/main.py
          ! grep -Eq 'from trainer|import trainer|from agents|import agents|from scripts|import scripts' dist/main.py
      - name: Import generated submission
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('dist/main.py')
          spec=importlib.util.spec_from_file_location('adaptive_submission', p)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert callable(mod.agent)
          print('standalone agent import OK', p.stat().st_size)
          PY
      - name: Smoke test generated agent
        run: |
          python - <<'PY'
          import importlib.util
          from kaggle_environments import make
          spec=importlib.util.spec_from_file_location('submission','dist/main.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          env=make('kaggriculture', configuration={'episodeSteps': 720}, debug=True)
          env.run([mod.agent, 'starter'])
          final=env.state
          print([(s.reward, str(s.status)) for s in final])
          assert str(final[0].status) not in {'ERROR','INVALID','TIMEOUT'}
          PY
      - name: Benchmark generated agent against repository population
        run: |
          python scripts/benchmark_adaptive_population.py \
            --candidate dist/main.py \
            --opponent v2_frozen=agents/v2_frozen.py \
            --opponent v10_market_front_runner=agents/v10_market_front_runner.py \
            --opponent v11_adaptive=agents/v11_agent.py \
            --games-per-seat 4 \
            --seed-start 620000 \
            --output artifacts/adaptive_population_results.csv
          python - <<'PY'
          import csv
          from pathlib import Path
          rows=list(csv.DictReader(Path('artifacts/adaptive_population_results.csv').open()))
          assert rows, 'population benchmark produced no games'
          invalid=sum(r['candidate_status'] in {'ERROR','INVALID','TIMEOUT'} for r in rows)
          wins=sum(r['result']=='win' for r in rows)
          losses=sum(r['result']=='loss' for r in rows)
          ties=sum(r['result']=='tie' for r in rows)
          mean_delta=sum(float(r['delta']) for r in rows)/len(rows)
          print({'games':len(rows),'wins':wins,'losses':losses,'ties':ties,'invalid':invalid,'mean_delta':mean_delta})
          assert invalid == 0, 'candidate produced invalid/error/timeout games'
          PY
      - name: Build provenance report
        run: |
          python - <<'PY'
          import hashlib, json, csv
          from pathlib import Path
          harvest=json.loads(Path('raw_kaggle_replays/harvest_summary.json').read_text())
          corpus=json.loads(Path('replay_db/summary.json').read_text())
          routes=json.loads(Path('artifacts/route_library.json').read_text()).get('routes') or []
          agent=Path('dist/main.py')
          rows=list(csv.DictReader(Path('artifacts/adaptive_population_results.csv').open()))
          bench={
            'games': len(rows),
            'wins': sum(r['result']=='win' for r in rows),
            'losses': sum(r['result']=='loss' for r in rows),
            'ties': sum(r['result']=='tie' for r in rows),
            'invalid': sum(r['candidate_status'] in {'ERROR','INVALID','TIMEOUT'} for r in rows),
            'mean_delta': sum(float(r['delta']) for r in rows)/len(rows),
          }
          report={
            'generation': 2,
            'harvest': harvest,
            'corpus': corpus,
            'routes': len(routes),
            'route_strategies': sorted({r['strategy'] for r in routes}),
            'fallback': 'agents/v11_agent.py',
            'population_benchmark': bench,
            'agent_bytes': agent.stat().st_size,
            'agent_sha256': hashlib.sha256(agent.read_bytes()).hexdigest(),
          }
          Path('artifacts/build_report.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY
      - name: Upload generation 2 candidate
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-kaggriculture-agent-gen2
          path: |
            dist/main.py
            artifacts/route_library.json
            artifacts/build_report.json
            artifacts/adaptive_population_results.csv
            replay_db/index.csv
            replay_db/summary.json
            raw_kaggle_replays/harvest_summary.json
          retention-days: 14
