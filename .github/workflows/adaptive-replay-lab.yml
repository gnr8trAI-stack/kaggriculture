name: adaptive-replay-lab

on:
  workflow_dispatch:
  push:
    branches:
      - replay/full-corpus-2026-08-13
    paths:
      - .github/workflows/adaptive-replay-lab.yml

jobs:
  validate-adaptive-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Preflight replay tooling
        run: |
          test -f trainer/harvest_kaggle_replays.py
          test -f trainer/ingest_replays.py
          python -m py_compile trainer/harvest_kaggle_replays.py
          python -m py_compile trainer/ingest_replays.py

  harvest-train-build:
    needs: validate-adaptive-tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Reclaim runner disk space
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          sudo apt-get clean || true
          df -h /
      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install kaggle
      - name: Verify Kaggle authentication secret
        run: |
          test -n "$KAGGLE_API_TOKEN"
          echo 'Kaggle token is configured'
      - name: Harvest all public Kaggriculture replay datasets
        run: |
          rm -rf raw_kaggle_replays replay_db corpus_chunks
          python trainer/harvest_kaggle_replays.py --output raw_kaggle_replays
          df -h /
      - name: Ingest and deduplicate full corpus
        run: |
          python trainer/ingest_replays.py --input raw_kaggle_replays --output replay_db
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('raw_kaggle_replays/harvest_summary.json').read_text())
          s=json.loads(Path('replay_db/summary.json').read_text())
          assert h['json_files'] > 0, h
          assert s['unique_episodes'] > 0, s
          print(json.dumps({'harvest': h, 'corpus': s}, indent=2))
          PY
      - name: Package raw corpus into uploadable chunks
        run: |
          mkdir -p corpus_chunks
          tar -C raw_kaggle_replays -cf - replays_gz metadata harvest_summary.json | split -b 900M -d -a 3 - corpus_chunks/kaggriculture-replay-corpus.tar.part-
          ls -lh corpus_chunks
      - name: Upload complete raw replay corpus
        uses: actions/upload-artifact@v4
        with:
          name: kaggriculture-full-replay-corpus-2026-08-13
          path: corpus_chunks/kaggriculture-replay-corpus.tar.part-*
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Upload replay index and summaries
        uses: actions/upload-artifact@v4
        with:
          name: kaggriculture-replay-index-2026-08-13
          path: |
            replay_db/index.csv
            replay_db/summary.json
            raw_kaggle_replays/harvest_summary.json
            raw_kaggle_replays/metadata/**
          retention-days: 30
          if-no-files-found: error
