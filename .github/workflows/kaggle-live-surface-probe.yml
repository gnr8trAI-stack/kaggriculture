name: kaggle-live-surface-probe

on:
  push:
    branches:
      - agent/adaptive-replay-lab-final
    paths:
      - '.github/workflows/kaggle-live-surface-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install kaggle
          test -n "$KAGGLE_API_TOKEN"
      - name: Discover Kaggriculture competition surface
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          kaggle competitions list -s kaggriculture --csv > artifacts/competitions.csv 2> artifacts/competitions.err
          echo $? > artifacts/competitions.exit
          kaggle datasets list -s kaggriculture --csv > artifacts/datasets.csv 2> artifacts/datasets.err
          echo $? > artifacts/datasets.exit
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path('artifacts/competitions.csv')
          rows=[]
          if p.exists() and p.stat().st_size:
              try: rows=list(csv.DictReader(p.open()))
              except Exception: rows=[]
          refs=[]
          for r in rows:
              ref=(r.get('ref') or r.get('Ref') or '').strip()
              if ref: refs.append(ref)
          Path('artifacts/discovery.json').write_text(json.dumps({'competition_refs':refs,'count':len(refs)},indent=2))
          print(json.dumps({'competition_refs':refs,'count':len(refs)},indent=2))
          PY
      - name: Query live submissions when a competition is discoverable
        shell: bash
        run: |
          set +e
          REF=$(python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('artifacts/discovery.json').read_text())
          print(x['competition_refs'][0] if x.get('competition_refs') else '')
          PY
          )
          if [ -n "$REF" ]; then
            echo "$REF" > artifacts/selected_competition.txt
            kaggle competitions submissions -c "$REF" --csv > artifacts/submissions.csv 2> artifacts/submissions.err
            echo $? > artifacts/submissions.exit
            kaggle competitions files -c "$REF" --csv > artifacts/files.csv 2> artifacts/files.err
            echo $? > artifacts/files.exit
          else
            echo 'No standard Kaggle competition ref discovered.' > artifacts/no_competition.txt
          fi
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-live-surface-probe
          path: artifacts/
          retention-days: 7
