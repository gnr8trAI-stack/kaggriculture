name: run-v33-industrial-v45
on:
  push:
    branches: [agent/v33-industrial]
    paths:
      - agents/v33_industrial_v45.py
      - .github/workflows/run-v33-industrial-v45.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v33-industrial
          path: candidate
      - uses: actions/checkout@v6
        with:
          ref: agent/v32.4-surplus-land
          path: baseline
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -q kaggle-environments
      - name: Compile
        run: |
          python -m py_compile candidate/agents/v33_industrial_v45.py
          python -m py_compile baseline/agents/v19_2_early_scale8.py
      - name: Run isolated 24-game both-seat readiness gate
        run: |
          python - <<'PY'
          import json,statistics,subprocess,sys
          from pathlib import Path
          CHILD=r'''
          import importlib,json,sys,os
          from kaggle_environments import make
          root,mod,seed,seat=sys.argv[1],sys.argv[2],int(sys.argv[3]),int(sys.argv[4]);sys.path.insert(0,root);os.chdir(root)
          a=importlib.import_module(mod)
          if hasattr(a,'reset_state'):a.reset_state()
          env=make('kaggriculture',configuration={'seed':seed},debug=False)
          env.run([a.agent,'starter'] if seat==0 else ['starter',a.agent])
          st=env.state[seat];tel=a.get_telemetry() if hasattr(a,'get_telemetry') else []
          peaks={'lands':0,'hands':0,'animals':0,'productive':0,'idle':0,'geese':0,'cows':0,'sheep':0}
          unlock={}; snaps={4:{},8:{},12:{},18:{},24:{},28:{}}
          for r in tel:
            if not isinstance(r,dict):continue
            for k in peaks:peaks[k]=max(peaks[k],int(r.get(k,0) or 0))
            for q,s in (r.get('land_unlock_steps') or {}).items():unlock[str(q)]=min(unlock.get(str(q),10**9),int(s))
            d=int(r.get('day',-1) or -1)
            if d in snaps:
              snaps[d]={'money':float(r.get('money',0) or 0),'productive':int(r.get('productive',0) or 0),'idle':int(r.get('idle',0) or 0),'lands':int(r.get('lands',0) or 0),'hands':int(r.get('hands',0) or 0),'animals':int(r.get('animals',0) or 0),'geese':int(r.get('geese',0) or 0),'cows':int(r.get('cows',0) or 0),'sheep':int(r.get('sheep',0) or 0)}
          last=tel[-1] if tel else {}
          print('RESULTJSON='+json.dumps({'status':str(st.status),'reward':float(st.reward or 0),'peaks':peaks,'unlock':unlock,'snaps':snaps,'last':{'capex':last.get('v45_true_capex_proxy',{}),'revenue':last.get('v45_sale_revenue_quote',0),'reinvest':last.get('v45_reinvestment_ratio',0),'shed':last.get('shed_snapshot',{})}},separators=(',',':')))
          '''
          def one(root,mod,seed,seat):
            try:p=subprocess.run([sys.executable,'-c',CHILD,root,mod,str(seed),str(seat)],text=True,capture_output=True,timeout=160)
            except subprocess.TimeoutExpired:return {'status':'TIMEOUT','reward':0.0,'peaks':{},'unlock':{},'snaps':{},'stderr':'timeout'}
            line=next((x for x in reversed(p.stdout.splitlines()) if x.startswith('RESULTJSON=')),None)
            if p.returncode or not line:return {'status':'ERROR','reward':0.0,'peaks':{},'unlock':{},'snaps':{},'stderr':(p.stderr+p.stdout)[-4000:]}
            return json.loads(line.split('=',1)[1])
          rows=[]
          for seed in range(377000,377012):
            for seat in (0,1):
              c=one('candidate','agents.v33_industrial_v45',seed,seat)
              b=one('baseline','agents.v19_2_early_scale8',seed,seat)
              rows.append({'seed':seed,'seat':seat,'candidate':c,'control_v19_2':b,'delta':c['reward']-b['reward']})
          def summ(key):
            rs=[x[key] for x in rows];rw=[float(r.get('reward',0) or 0) for r in rs];s=sorted(rw)
            out={'games':len(rs),'invalid':sum(str(r.get('status')) in ('ERROR','INVALID','TIMEOUT') for r in rs),'mean':statistics.mean(rw),'median':statistics.median(rw),'min':min(rw),'p10':s[2],'p25':s[5],'p75':s[18],'p90':s[-3],'max':max(rw)}
            if key=='candidate':
              for k in ('lands','productive','hands','animals','geese','cows','sheep'):out['median_peak_'+k]=statistics.median(float((r.get('peaks') or {}).get(k,0) or 0) for r in rs)
              for q in ('2','3','4'):
                vals=[int((r.get('unlock') or {}).get(q,9999)) for r in rs];out['median_unlock_q'+q]=statistics.median(vals)
              for d in (4,8,12,18,24,28):
                for k in ('money','productive','animals'):
                  out[f'median_d{d}_{k}']=statistics.median(float(((r.get('snaps') or {}).get(str(d)) or (r.get('snaps') or {}).get(d) or {}).get(k,0) or 0) for r in rs)
            return out
          c=summ('candidate');b=summ('control_v19_2');ds=[x['delta'] for x in rows]
          report={'version':'33.45.0-mechanics-priced-factory','candidate':c,'control_v19_2':b,'paired':{'wins':sum(x>0 for x in ds),'losses':sum(x<0 for x in ds),'median_delta':statistics.median(ds)},'ready_150k':c['invalid']==0 and c['games']>=24 and c['median']>=150000 and c['min']>=100000,'games_detail':rows}
          Path('/tmp/v3345.json').write_text(json.dumps(report,indent=2));print(json.dumps({k:v for k,v in report.items() if k!='games_detail'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v33-45-benchmark
          path: /tmp/v3345.json
          retention-days: 14
