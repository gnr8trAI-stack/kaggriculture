name: run-v33-43-goose-industrial
on:
  push:
    branches: [agent/v33-industrial]
    paths:
      - 'agents/v33_industrial_v43.py'
      - '.github/workflows/run-v33-industrial-v43.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with: {ref: agent/v33-industrial, path: candidate}
      - uses: actions/checkout@v6
        with: {ref: agent/v32.4-surplus-land, path: baseline}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: pip install -q kaggle-environments
      - name: Compile
        run: |
          python -m py_compile candidate/agents/v33_industrial_v39.py candidate/agents/v33_industrial_v42.py candidate/agents/v33_industrial_v43.py
          python -m py_compile baseline/agents/v19_2_early_scale8.py
      - name: Run isolated 24-game both-seat readiness gate
        run: |
          python - <<'PY'
          import json,statistics,subprocess,sys
          from pathlib import Path
          CHILD=r'''
          import importlib,json,sys,os
          from kaggle_environments import make
          root,mod,seed,seat=sys.argv[1],sys.argv[2],int(sys.argv[3]),int(sys.argv[4]);sys.path.insert(0,root);os.chdir(root)
          a=importlib.import_module(mod)
          if hasattr(a,'reset_state'):a.reset_state()
          env=make('kaggriculture',configuration={'seed':seed},debug=False)
          env.run([a.agent,'starter'] if seat==0 else ['starter',a.agent])
          st=env.state[seat];tel=a.get_telemetry() if hasattr(a,'get_telemetry') else []
          snaps={12:{},18:{},20:{},25:{}};peaks={'lands':0,'hands':0,'animals':0,'productive':0,'idle':0}
          for r in tel:
            if not isinstance(r,dict):continue
            for k in peaks:peaks[k]=max(peaks[k],int(r.get(k,0) or 0))
            d=int(r.get('day',-1) or -1)
            if d in snaps:snaps[d]={'money':float(r.get('money',0) or 0),'productive':int(r.get('productive',0) or 0),'lands':int(r.get('lands',0) or 0),'hands':int(r.get('hands',0) or 0),'animals':int(r.get('animals',0) or 0),'idle':int(r.get('idle',0) or 0)}
          industrial=a.industrial_peaks() if hasattr(a,'industrial_peaks') else {}
          print('RESULTJSON='+json.dumps({'status':str(st.status),'reward':float(st.reward or 0),'peaks':peaks,'industrial':industrial,'d12':snaps[12],'d18':snaps[18],'d20':snaps[20],'d25':snaps[25]},separators=(',',':')))
          '''
          def one(root,mod,seed,seat):
            try:p=subprocess.run([sys.executable,'-c',CHILD,root,mod,str(seed),str(seat)],text=True,capture_output=True,timeout=150)
            except subprocess.TimeoutExpired:return {'status':'TIMEOUT','reward':0.0,'peaks':{},'industrial':{}}
            line=next((x for x in reversed(p.stdout.splitlines()) if x.startswith('RESULTJSON=')),None)
            if p.returncode or not line:return {'status':'ERROR','reward':0.0,'peaks':{},'industrial':{},'stderr':(p.stderr+p.stdout)[-2400:]}
            return json.loads(line.split('=',1)[1])
          rows=[]
          for seed in range(375000,375012):
            for seat in (0,1):
              c=one('candidate','agents.v33_industrial_v43',seed,seat)
              p=one('candidate','agents.v33_industrial_v42',seed,seat)
              b=one('baseline','agents.v19_2_early_scale8',seed,seat)
              rows.append({'seed':seed,'seat':seat,'candidate':c,'parent_v42':p,'control_v19_2':b,'delta_parent':c['reward']-p['reward'],'delta_control':c['reward']-b['reward']})
          def summ(key):
            rs=[x[key] for x in rows];rw=[float(r.get('reward',0) or 0) for r in rs];s=sorted(rw)
            out={'games':len(rs),'invalid':sum(str(r.get('status')) in ('ERROR','INVALID','TIMEOUT') for r in rs),'mean':statistics.mean(rw),'median':statistics.median(rw),'min':min(rw),'p10':s[2],'p25':s[5],'p90':s[-3],'max':max(rw)}
            if key=='candidate':
              out['median_peak_productive']=statistics.median(float((r.get('peaks') or {}).get('productive',0) or 0) for r in rs)
              out['median_peak_animals']=statistics.median(float((r.get('peaks') or {}).get('animals',0) or 0) for r in rs)
              out['median_peak_hands']=statistics.median(float((r.get('peaks') or {}).get('hands',0) or 0) for r in rs)
              out['median_peak_geese']=statistics.median(float((r.get('industrial') or {}).get('geese',0) or 0) for r in rs)
              out['median_peak_coops']=statistics.median(float((r.get('industrial') or {}).get('coops',0) or 0) for r in rs)
              out['q4_games']=sum(int((r.get('industrial') or {}).get('lands',0) or 0)>=4 for r in rs)
              out['q4_coop_games']=sum(int((r.get('industrial') or {}).get('q4_coops',0) or 0)>0 for r in rs)
              for d in (12,18,20,25):
                out[f'median_d{d}_money']=statistics.median(float((r.get('d'+str(d)) or {}).get('money',0) or 0) for r in rs)
                out[f'median_d{d}_hands']=statistics.median(float((r.get('d'+str(d)) or {}).get('hands',0) or 0) for r in rs)
                out[f'median_d{d}_animals']=statistics.median(float((r.get('d'+str(d)) or {}).get('animals',0) or 0) for r in rs)
            return out
          c=summ('candidate');p=summ('parent_v42');b=summ('control_v19_2');dp=[x['delta_parent'] for x in rows];db=[x['delta_control'] for x in rows]
          report={'version':'33.43.0-goose-industrial','mechanism':'Q3/Q4 goose factories using glut-resistant eggs + daily fertilizer, with ROI-gated Q4 and protected crop labour','candidate':c,'parent_v42':p,'control_v19_2':b,'paired_parent':{'wins':sum(x>0 for x in dp),'losses':sum(x<0 for x in dp),'median_delta':statistics.median(dp)},'paired_control':{'wins':sum(x>0 for x in db),'losses':sum(x<0 for x in db),'median_delta':statistics.median(db)},'ready_150k':c['invalid']==0 and c['games']>=24 and c['median']>=150000 and c['min']>=100000 and c.get('q4_games',0)>0 and c.get('q4_coop_games',0)>0,'games_detail':rows}
          Path('/tmp/v3343.json').write_text(json.dumps(report,indent=2));print(json.dumps({k:v for k,v in report.items() if k!='games_detail'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: v33-43-goose-industrial, path: /tmp/v3343.json, if-no-files-found: ignore, retention-days: 14}
