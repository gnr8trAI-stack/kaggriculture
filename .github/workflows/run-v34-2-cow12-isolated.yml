name: run-v34-9-herd-funded-third-land-rerun
on:
  push:
    branches: [main]
    paths: ['.github/workflows/run-v34-2-cow12-isolated.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout V19.2 control
        uses: actions/checkout@v6
        with:
          ref: agent/v32.4-surplus-land
          path: baseline
      - name: Checkout V34.9 candidate
        uses: actions/checkout@v6
        with:
          ref: agent/v34.9-herd-funded-third-land-rerun
          path: candidate
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install environment
        run: pip install -q kaggle-environments
      - name: Compile candidate and control
        run: |
          python -m py_compile candidate/agents/v34_9_herd_funded_third_land_rerun.py
          python -m py_compile candidate/agents/v34_6_cow16_window24_isolated.py
          python -m py_compile baseline/agents/v19_2_early_scale8.py
      - name: Run fresh-process paired benchmark
        run: |
          python - <<'PY'
          import json, statistics, subprocess, sys
          from pathlib import Path

          CHILD = r'''
          import importlib, json, sys
          from kaggle_environments import make
          modname, seed, seat = sys.argv[1], int(sys.argv[2]), int(sys.argv[3])
          a = importlib.import_module(modname)
          if hasattr(a, 'reset_state'): a.reset_state()
          env = make('kaggriculture', configuration={'seed': seed}, debug=False)
          env.run([a.agent, 'starter'] if seat == 0 else ['starter', a.agent])
          st = env.state[seat]
          tel = a.get_telemetry() if hasattr(a, 'get_telemetry') else []
          final = tel[-1] if tel else {}
          out = {
              'status': str(st.status), 'reward': float(st.reward or 0),
              'peak_cows': max([int(r.get('cow_count',0) or 0) for r in tel] or [0]),
              'peak_active_cows': max([int(r.get('active_cows',0) or 0) for r in tel] or [0]),
              'peak_pastures': max([int(r.get('pastures',0) or 0) for r in tel] or [0]),
              'unlocked_count': int(final.get('unlocked_count',0) or 0),
              'final_productive': int(final.get('productive',0) or 0),
              'final_empty': int(final.get('empty',0) or 0),
              'final_money': float(final.get('money',0) or 0),
          }
          print('RESULTJSON=' + json.dumps(out, separators=(',',':')))
          '''

          def one(cwd, mod, seed, seat):
              p = subprocess.run([sys.executable, '-c', CHILD, mod, str(seed), str(seat)], cwd=cwd,
                                 text=True, capture_output=True, timeout=170)
              line = next((x for x in reversed(p.stdout.splitlines()) if x.startswith('RESULTJSON=')), None)
              if p.returncode or not line:
                  return {'status':'ERROR','reward':0.0,'peak_cows':0,'peak_active_cows':0,
                          'peak_pastures':0,'unlocked_count':0,'final_productive':0,'final_empty':0,
                          'final_money':0.0,'stderr':p.stderr[-1600:]}
              return json.loads(line.split('=',1)[1])

          rows=[]
          for seed in range(349000, 349016):
              for seat in (0,1):
                  b = one('baseline', 'agents.v19_2_early_scale8', seed, seat)
                  c = one('candidate', 'agents.v34_9_herd_funded_third_land_rerun', seed, seat)
                  rows.append({'seed':seed,'seat':seat,'baseline':b,'candidate':c,'delta':c['reward']-b['reward']})
                  print(seed, seat, b['reward'], c['reward'], c['peak_active_cows'], c['unlocked_count'])

          def summarize(which):
              rs=[x[which] for x in rows]; rewards=[x['reward'] for x in rs]; sr=sorted(rewards)
              return {
                  'games':len(rs),
                  'invalid':sum(x['status'] in ('ERROR','INVALID','TIMEOUT') for x in rs),
                  'mean':statistics.mean(rewards),'median':statistics.median(rewards),'min':min(rewards),
                  'p10':sr[max(0,int(len(sr)*.1)-1)],'p25':statistics.median(sr[:len(sr)//2]),
                  'p75':statistics.median(sr[(len(sr)+1)//2:]),'max':max(rewards),
                  'median_peak_cows':statistics.median(x['peak_cows'] for x in rs),
                  'median_peak_active_cows':statistics.median(x['peak_active_cows'] for x in rs),
                  'max_peak_active_cows':max(x['peak_active_cows'] for x in rs),
                  'median_peak_pastures':statistics.median(x['peak_pastures'] for x in rs),
                  'three_land_games':sum(x['unlocked_count']>=3 for x in rs),
                  'median_final_productive':statistics.median(x['final_productive'] for x in rs),
                  'median_final_empty':statistics.median(x['final_empty'] for x in rs),
                  'median_final_money':statistics.median(x['final_money'] for x in rs),
              }
          bs=summarize('baseline'); cs=summarize('candidate'); d=[x['delta'] for x in rows]
          report={
              'version':'34.9.0-herd-funded-third-land-rerun',
              'mechanism':'V34.6 unchanged except exactly one third-land purchase after >=10 active cows, >=10 pastures, >=5200 cash, healthy farm, days 10-19; dependency-correct rerun of invalid V34.8',
              'baseline_v19_2':bs,'candidate_v34_9':cs,
              'paired':{'wins':sum(x>0 for x in d),'losses':sum(x<0 for x in d),'ties':sum(x==0 for x in d),
                        'mean_delta':statistics.mean(d),'median_delta':statistics.median(d)},
              'ready_150k':cs['invalid']==0 and cs['games']>=24 and cs['median']>=150000 and cs['min']>=100000,
              'games_detail':rows,
          }
          Path('/tmp/v349_report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps({k:v for k,v in report.items() if k!='games_detail'},indent=2))
          PY
      - name: Record result in issue 16
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '## V34.9 isolated herd-funded-third-land rerun'; echo; echo '```json'; cat /tmp/v349_report.json 2>/dev/null || echo '{"error":"no report"}'; echo '```'; } > /tmp/v349.md
          gh issue comment 16 --repo "$GITHUB_REPOSITORY" --body-file /tmp/v349.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v34-9-herd-funded-third-land-rerun-benchmark
          path: /tmp/v349_report.json
          if-no-files-found: ignore
          retention-days: 14