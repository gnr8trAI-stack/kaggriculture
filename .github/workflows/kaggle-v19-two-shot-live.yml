name: kaggle-v19-two-shot-live

on:
  pull_request:
    paths:
      - '.github/LIVE_TWO_SHOT_TRIGGER'

concurrency:
  group: kaggle-v19-two-shot-live
  cancel-in-progress: false

jobs:
  submit-two:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Check one-use arm
        id: arm
        shell: bash
        run: |
          if [ -f .github/LIVE_TWO_SHOT_TRIGGER ] && grep -q '^armed=true$' .github/LIVE_TWO_SHOT_TRIGGER; then
            echo 'armed=true' >> "$GITHUB_OUTPUT"
            echo 'Two-shot live campaign is ARMED.'
          else
            echo 'armed=false' >> "$GITHUB_OUTPUT"
            echo 'Two-shot live campaign is not armed; no Kaggle submission will occur.'
          fi

      - uses: actions/setup-python@v6
        if: steps.arm.outputs.armed == 'true'
        with:
          python-version: '3.11'

      - name: Install Kaggle CLI
        if: steps.arm.outputs.armed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install kaggle
          test -n "$KAGGLE_API_TOKEN"
          kaggle --version

      - name: Build standalone candidate ZIPs
        if: steps.arm.outputs.armed == 'true'
        run: |
          mkdir -p live_two_shot artifacts
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          import agents.v15_champion as champ

          v19=Path('agents/v19_livestock_compound.py').read_text()
          marker='from agents import v15_champion as _v15'
          embedded=(
              'import base64 as _b64, zlib as _zl, types as _types\n'
              '_v15=_types.ModuleType("_v15_embedded")\n'
              f'_V15_PAYLOAD={champ._PAYLOAD!r}\n'
              'exec(_zl.decompress(_b64.b64decode(_V15_PAYLOAD)).decode("utf-8"),_v15.__dict__,_v15.__dict__)'
          )
          assert marker in v19
          v19s=v19.replace(marker,embedded,1)
          specs=[
              ('v19.1-feed-order-guard','agents/v19_1_feed_order_guard.py'),
              ('v19.2-early-scale8','agents/v19_2_early_scale8.py'),
          ]
          manifest=[]
          for version,path in specs:
              src=Path(path).read_text()
              mark='from agents import v19_livestock_compound as _v19'
              assert mark in src, path
              replacement=(
                  'import types as _types_live\n'
                  '_v19=_types_live.ModuleType("_v19_embedded")\n'
                  'exec('+repr(v19s)+',_v19.__dict__,_v19.__dict__)'
              )
              standalone=src.replace(mark,replacement,1)
              compile(standalone,'main.py','exec')
              d=Path('live_two_shot')/version
              d.mkdir(parents=True,exist_ok=True)
              main=d/'main.py'; main.write_text(standalone)
              z=d/f'kaggriculture_adaptive_{version}_submission.zip'
              with zipfile.ZipFile(z,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as f:
                  f.write(main,'main.py')
              with zipfile.ZipFile(z) as f:
                  assert f.namelist()==['main.py']
              manifest.append({'version':version,'zip':str(z),'sha256':hashlib.sha256(z.read_bytes()).hexdigest()})
          Path('artifacts/two_shot_manifest.json').write_text(json.dumps(manifest,indent=2))
          print(json.dumps(manifest,indent=2))
          PY

      - name: Enforce daily submission budget
        if: steps.arm.outputs.armed == 'true'
        id: budget
        shell: bash
        run: |
          kaggle competitions submissions kaggriculture -v -q > artifacts/submissions_before.csv
          kaggle competitions list --group entered -s kaggriculture --csv > artifacts/competition_before.csv
          python - <<'PY'
          import csv,datetime,json,os
          from pathlib import Path
          rows=list(csv.DictReader(Path('artifacts/submissions_before.csv').open()))
          today=datetime.datetime.utcnow().date().isoformat()
          used=sum(str(r.get('date','')).startswith(today) for r in rows)
          remaining=max(0,5-used)
          allowed=min(2,remaining)
          payload={'utc_date':today,'used_today':used,'remaining_today':remaining,'allowed_now':allowed}
          Path('artifacts/submission_budget.json').write_text(json.dumps(payload,indent=2))
          print(json.dumps(payload,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'allowed={allowed}\n')
          if allowed < 2:
              raise SystemExit(f'Refusing two-shot run: only {allowed} submission slots remain')
          PY

      - name: Submit V19.1 feed-order guard
        if: steps.arm.outputs.armed == 'true' && steps.budget.outputs.allowed == '2'
        shell: bash
        run: |
          set -o pipefail
          ZIP=$(find live_two_shot/v19.1-feed-order-guard -name '*.zip' | head -1)
          kaggle competitions submit kaggriculture -f "$ZIP" -m "V19.1 carried-feed order guard live challenger" | tee artifacts/shot1_submit.txt
          REF=$(grep -Eo 'Submission ref: *[0-9]+' artifacts/shot1_submit.txt | grep -Eo '[0-9]+' | tail -1 || true)
          echo "$REF" > artifacts/shot1_ref.txt
          sleep 5
          kaggle competitions submissions kaggriculture -v -q > artifacts/submissions_after_shot1.csv
          kaggle competitions list --group entered -s kaggriculture --csv > artifacts/competition_after_shot1.csv
          cat artifacts/competition_after_shot1.csv
          head -5 artifacts/submissions_after_shot1.csv

      - name: Submit V19.2 early-scale challenger
        if: steps.arm.outputs.armed == 'true' && steps.budget.outputs.allowed == '2'
        shell: bash
        run: |
          set -o pipefail
          ZIP=$(find live_two_shot/v19.2-early-scale8 -name '*.zip' | head -1)
          kaggle competitions submit kaggriculture -f "$ZIP" -m "V19.2 feed-aware early scale live challenger" | tee artifacts/shot2_submit.txt
          REF=$(grep -Eo 'Submission ref: *[0-9]+' artifacts/shot2_submit.txt | grep -Eo '[0-9]+' | tail -1 || true)
          echo "$REF" > artifacts/shot2_ref.txt
          sleep 5

      - name: Final live snapshot
        if: always() && steps.arm.outputs.armed == 'true'
        run: |
          kaggle competitions list --group entered -s kaggriculture --csv > artifacts/competition_after.csv || true
          kaggle competitions submissions kaggriculture -v -q > artifacts/submissions_after.csv || true
          cat artifacts/competition_after.csv || true
          head -8 artifacts/submissions_after.csv || true

      - name: Upload live evidence and packages
        if: always() && steps.arm.outputs.armed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kaggriculture-v19-two-shot-live
          path: |
            artifacts/
            live_two_shot/*/*.zip
          retention-days: 30
