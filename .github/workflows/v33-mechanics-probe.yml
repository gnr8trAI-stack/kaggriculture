name: v33-8-debug-probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v33-mechanics-probe.yml']
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v33-industrial
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install
        id: install
        run: pip install -q kaggle-environments
      - name: Compile and import
        id: compile
        run: |
          python -m py_compile agents/v33_industrial.py agents/v33_industrial_v8.py
          python - <<'PY'
          import agents.v33_industrial_v8 as a
          print('import ok',a)
          PY
      - name: One game diagnostic
        id: game
        run: |
          python - <<'PY'
          import json, traceback
          from pathlib import Path
          result={'stage':'start'}
          try:
            from kaggle_environments import make
            import agents.v33_industrial_v8 as a
            a.reset_state()
            env=make('kaggriculture',configuration={'seed':338000},debug=True)
            env.run([a.agent,'starter'])
            st=env.state[0]
            tel=a.get_telemetry()
            result={'stage':'game','status':str(st.status),'reward':float(st.reward or 0),'telemetry_rows':len(tel),'last':tel[-1] if tel else {}}
          except Exception as e:
            result={'stage':'exception','error':repr(e),'traceback':traceback.format_exc()}
          Path('/tmp/v338probe.json').write_text(json.dumps(result,indent=2,default=str))
          print(json.dumps(result,indent=2,default=str))
          PY
      - name: Record probe
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '## V33.8 debug probe'; echo 'install=${{ steps.install.outcome }} compile=${{ steps.compile.outcome }} game=${{ steps.game.outcome }}'; echo '```json'; cat /tmp/v338probe.json 2>/dev/null || echo '{"error":"probe did not reach game"}'; echo '```'; } >/tmp/comment.md
          gh issue comment 16 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
