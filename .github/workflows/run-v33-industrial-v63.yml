name: run-v33-industrial-v63
on:
  push:
    branches: [agent/v33-industrial]
    paths: [agents/v33_industrial_v63.py, .github/workflows/run-v33-industrial-v63.yml]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with: {ref: agent/v33-industrial, path: candidate}
      - uses: actions/checkout@v6
        with: {ref: agent/v32.4-surplus-land, path: baseline}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: pip install -q kaggle-environments
      - run: |
          python -m py_compile candidate/agents/v33_industrial_v63.py
          python -m py_compile candidate/agents/v33_industrial_v29.py
          python -m py_compile candidate/agents/v33_industrial_v28.py
          python -m py_compile baseline/agents/v19_2_early_scale8.py
      - name: Isolated 24-game x4 benchmark
        run: |
          python - <<'PY'
          import json,statistics,subprocess,sys
          from pathlib import Path
          CHILD=r'''
          import importlib,json,sys
          from kaggle_environments import make
          root,mod,seed,seat=sys.argv[1],sys.argv[2],int(sys.argv[3]),int(sys.argv[4]);sys.path.insert(0,root);a=importlib.import_module(mod)
          if hasattr(a,'reset_state'):a.reset_state()
          env=make('kaggriculture',configuration={'seed':seed},debug=False);env.run([a.agent,'starter'] if seat==0 else ['starter',a.agent]);st=env.state[seat]
          tel=a.get_telemetry() if hasattr(a,'get_telemetry') else [];peaks={k:0 for k in ('lands','hands','animals','productive','idle','geese','cows','sheep')};q4=False
          for r in tel:
            if not isinstance(r,dict):continue
            for k in peaks:peaks[k]=max(peaks[k],int(r.get(k,0) or 0))
            q4=q4 or int(r.get('lands',0) or 0)>=4
          print('RESULTJSON='+json.dumps({'status':str(st.status),'reward':float(st.reward or 0),'peaks':peaks,'q4':q4},separators=(',',':')))
          '''
          def one(root,mod,seed,seat):
            try:p=subprocess.run([sys.executable,'-c',CHILD,root,mod,str(seed),str(seat)],text=True,capture_output=True,timeout=170)
            except subprocess.TimeoutExpired:return {'status':'TIMEOUT','reward':0,'peaks':{},'q4':False}
            line=next((x for x in reversed(p.stdout.splitlines()) if x.startswith('RESULTJSON=')),None)
            if p.returncode or not line:return {'status':'ERROR','reward':0,'peaks':{},'q4':False}
            return json.loads(line.split('=',1)[1])
          specs={'baseline_v19_2':('baseline','agents.v19_2_early_scale8'),'control_v33_28':('candidate','agents.v33_industrial_v28'),'parent_v33_29':('candidate','agents.v33_industrial_v29'),'candidate_v33_63':('candidate','agents.v33_industrial_v63')}
          rows={}
          for n,(root,mod) in specs.items():
            rows[n]=[{'seed':s,'seat':seat,**one(root,mod,s,seat)} for s in range(383000,383012) for seat in (0,1)]
          def sm(rr):
            rw=[float(r.get('reward',0) or 0) for r in rr];z=sorted(rw);o={'games':len(rr),'invalid':sum(r.get('status')!='DONE' for r in rr),'mean':statistics.mean(rw),'median':statistics.median(rw),'min':min(rw),'p10':z[2],'p25':z[5],'p75':z[18],'p90':z[-3],'max':max(rw),'q4_games':sum(bool(r.get('q4')) for r in rr)}
            for k in ('lands','hands','animals','productive','idle','geese','cows','sheep'):o['median_peak_'+k]=statistics.median(float((r.get('peaks') or {}).get(k,0) or 0) for r in rr)
            return o
          ss={k:sm(v) for k,v in rows.items()};cand=ss['candidate_v33_63'];ready=cand['invalid']==0 and cand['games']>=24 and cand['median']>=150000 and cand['min']>=100000
          def pair(other):
            d=[rows['candidate_v33_63'][i]['reward']-rows[other][i]['reward'] for i in range(24)];return {'wins':sum(x>0 for x in d),'losses':sum(x<0 for x in d),'ties':sum(x==0 for x in d),'mean_delta':statistics.mean(d),'median_delta':statistics.median(d)}
          report={'version':'33.63.0-absorption-matched-animal-feed','mechanism':'Q3 exact town-absorption animal sizing + Q4 low-cost wheat feed factory','summaries':ss,'paired_vs_v33_28':pair('control_v33_28'),'paired_vs_v33_29':pair('parent_v33_29'),'paired_vs_v19_2':pair('baseline_v19_2'),'ready_150k':ready,'games_detail':rows['candidate_v33_63']}
          Path('candidate/benchmarks/v33_v63_latest.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: v33-63-isolated-benchmark, path: candidate/benchmarks/v33_v63_latest.json, retention-days: 14}
      - name: Record result in issue 16
        if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          { echo '## V33.63 isolated absorption-matched factory benchmark'; echo; echo '```json'; cat candidate/benchmarks/v33_v63_latest.json 2>/dev/null || echo '{"error":"no report"}'; echo '```'; } >/tmp/v63.md
          gh issue comment 16 --repo "$GITHUB_REPOSITORY" --body-file /tmp/v63.md
      - name: Persist benchmark
        if: success()
        working-directory: candidate
        run: |
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmarks/v33_v63_latest.json
          if ! git diff --cached --quiet; then git commit -m 'bench: record V33.63 isolated distribution' && git push origin HEAD:agent/v33-industrial; fi
