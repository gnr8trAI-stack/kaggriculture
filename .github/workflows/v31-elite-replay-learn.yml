name: V31 Elite Replay Learn

on:
  push:
    branches: [v31-elite-trajectory]
    paths:
      - 'research/v31/**'
      - '.github/workflows/v31-elite-replay-learn.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  learn:
    runs-on: ubuntu-24.04
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Kaggle CLI
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q kaggle
          test -n "$KAGGLE_API_TOKEN"
      - name: Download current Kaggriculture replay snapshot
        run: |
          mkdir -p /tmp/v31-data
          kaggle competitions download kaggriculture -p /tmp/v31-data
          find /tmp/v31-data -maxdepth 2 -type f -printf '%p %s bytes\n' | head -30
      - name: Extract elite economic cohorts
        run: |
          set -euo pipefail
          INPUT=$(find /tmp/v31-data -type f -name '*.zip' | head -1)
          test -n "$INPUT"
          for Q in 80 90 95 99; do
            D="research/v31/artifacts/q${Q}"
            python research/v31/v31_extract_elite_transitions.py \
              --input "$INPUT" --output "$D" --elite-quantile "0.${Q}"
          done
      - name: Build compact research summary
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          lines=['# V31 elite replay extraction','']
          for q in (80,90,95,99):
              d=Path(f'research/v31/artifacts/q{q}')
              s=json.loads((d/'elite_summary.json').read_text())
              lines += [f'## Top {100-q}% winner cohort', '',
                        f"- episodes scanned: {s['episodes_scanned']}",
                        f"- winner trajectories: {s['winner_count']}",
                        f"- elite reward threshold: {s['elite_reward_threshold']:.1f}",
                        f"- elite trajectories: {s['elite_trajectories']}",
                        f"- transition rows: {s['elite_transition_rows']}",
                        f"- winner reward p90/p99/max: {s['winner_reward_p90']:.1f} / {s['winner_reward_p99']:.1f} / {s['max_winner_reward']:.1f}", '']
              cps=list(csv.DictReader((d/'elite_checkpoints.csv').open()))
              if cps:
                  lines += ['Key wealth checkpoints (elite p50/p90):','']
                  for r in cps:
                      lines.append(f"- day {r['day']}: money {float(r['money_p50']):.0f}/{float(r['money_p90']):.0f}, land {float(r['land_p50']):.1f}/{float(r['land_p90']):.1f}, hands {float(r['hands_p50']):.1f}/{float(r['hands_p90']):.1f}, animals {float(r['animals_p50']):.1f}/{float(r['animals_p90']):.1f}")
                  lines.append('')
          Path('/tmp/v31-summary.md').write_text('\n'.join(lines))
          print('\n'.join(lines))
          PY
      - name: Upload V31 lightweight artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v31-elite-economic-artifacts
          path: |
            research/v31/artifacts/**/elite_summary.json
            research/v31/artifacts/**/elite_checkpoints.csv
            research/v31/artifacts/**/elite_action_value.csv
            /tmp/v31-summary.md
          retention-days: 14
      - name: Post summary to V31 issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 16 --repo "$GITHUB_REPOSITORY" --body-file /tmp/v31-summary.md
