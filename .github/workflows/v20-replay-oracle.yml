name: v20-replay-oracle

on:
  push:
    branches:
      - agent/adaptive-replay-lab-final
    paths:
      - 'trainer/mine_strategy_archetypes.py'
      - 'trainer/generate_v20_oracle.py'
      - '.github/workflows/v20-replay-oracle.yml'
  workflow_dispatch:

jobs:
  replay-oracle-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Reclaim runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          sudo apt-get clean || true
          df -h /

      - name: Install Kaggle and simulator
        run: |
          python -m pip install --upgrade pip
          pip install kaggle kaggle-environments

      - name: Verify tooling and authentication
        run: |
          test -n "$KAGGLE_API_TOKEN"
          python -m py_compile trainer/harvest_kaggle_replays.py trainer/ingest_replays.py
          python -m py_compile trainer/mine_strategy_archetypes.py trainer/generate_v20_oracle.py
          python -m py_compile agents/v15_champion.py agents/v19_livestock_compound.py

      - name: Harvest real public Kaggriculture replay corpus
        run: |
          python trainer/harvest_kaggle_replays.py --output raw_kaggle_replays
          df -h /

      - name: Ingest chronological replay corpus
        run: |
          python trainer/ingest_replays.py --input raw_kaggle_replays --output replay_db
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('replay_db/summary.json').read_text())
          assert s['unique_episodes'] > 1000, s
          assert s['fit_rows'] > 500, s
          assert s['identity_coverage'] >= .95, s
          print(json.dumps(s,indent=2))
          PY

      - name: Mine one real strategy archetype
        run: |
          mkdir -p artifacts dist
          python trainer/mine_strategy_archetypes.py --corpus replay_db --output artifacts/strategy_oracle.json
          python - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path('artifacts/strategy_oracle.json').read_text())
          assert o['source'].startswith('real fit-window'), o
          assert o['outer_window_used'] is False, o
          assert o['selected_statistics']['trajectories'] >= o['minimum_archetype_sample'], o
          print('SELECTED ARCHETYPE:',o['selected_archetype'])
          print(json.dumps(o['selected_statistics'],indent=2))
          print(json.dumps(o['selected_profile'],indent=2))
          PY

      - name: Generate exactly one V20 challenger
        run: |
          python trainer/generate_v20_oracle.py \
            --oracle artifacts/strategy_oracle.json \
            --base agents/v19_livestock_compound.py \
            --output dist/v20_candidate.py
          python -m py_compile dist/v20_candidate.py

      - name: Run replay-oracle economic tournament
        run: |
          python - <<'PY'
          import csv, importlib.util, json, math, statistics, time
          from pathlib import Path
          from kaggle_environments import make

          BAD={'ERROR','INVALID','TIMEOUT'}

          def load(path,name):
              spec=importlib.util.spec_from_file_location(name,path)
              mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
              return mod

          v20m=load('dist/v20_candidate.py','v20_candidate')
          v19m=load('agents/v19_livestock_compound.py','v19_reference')
          v15m=load('agents/v15_champion.py','v15_reference')
          oracle=json.loads(Path('artifacts/strategy_oracle.json').read_text())
          expected_animals=int(oracle['selected_profile'].get('target_animals_day20',0) or 0)

          def weed_ratio(obs,seat):
              try: tiles=(obs.get('farms') or [])[seat].get('tiles') or []
              except Exception: return None
              usable=weeds=0
              for row in tiles:
                  for tile in row:
                      kind=str(tile.get('kind','')).upper() if isinstance(tile,dict) else ''
                      if tile=='LOCKED' or kind=='LOCKED': continue
                      usable += 1; weeds += int(kind=='WEED')
              return weeds/max(1,usable)

          def telemetry(module):
              if module is None or not callable(getattr(module,'get_telemetry',None)):
                  return []
              try: rows=module.get_telemetry(clear=True)
              except TypeError: rows=module.get_telemetry()
              return rows if isinstance(rows,list) else []

          def play(module,reference,seat,seed,series):
              if callable(getattr(module,'reset_state',None)): module.reset_state()
              candidate=module.agent
              agents=[candidate,reference] if seat==0 else [reference,candidate]
              env=make('kaggriculture',configuration={'seed':seed},debug=True)
              started=time.perf_counter(); env.run(agents); runtime=time.perf_counter()-started
              mine=env.state[seat]; other=env.state[1-seat]
              cr=float(mine.reward or 0); rr=float(other.reward or 0)
              weeds=[]
              for step in getattr(env,'steps',[]) or []:
                  try: obs=step[seat].observation
                  except Exception: continue
                  if isinstance(obs,dict):
                      r=weed_ratio(obs,seat)
                      if r is not None: weeds.append(r)
              tele=telemetry(module)
              active=max([int(t.get('active_cows',0) or 0) for t in tele] or [0])
              unlocked=max([int(t.get('unlocked_count',0) or 0) for t in tele] or [0])
              return {
                  'series':series,'seat':seat,'seed':seed,
                  'candidate_reward':cr,'reference_reward':rr,'delta':cr-rr,
                  'result':'win' if cr>rr else 'loss' if cr<rr else 'tie',
                  'candidate_status':str(mine.status),'reference_status':str(other.status),
                  'max_weed_ratio':max(weeds) if weeds else 0.0,
                  'max_active_animals':active,'max_unlocked':unlocked,
                  'runtime_seconds':runtime,
              }

          rows=[]
          # Frozen champion is the mandatory pairwise gate.
          for seat in (0,1):
              for offset in range(50):
                  r=play(v20m,v15m.agent,seat,880000+offset,'v20_vs_v15')
                  rows.append(r); print(r)

          # V19 is a diagnostic challenger comparison, not the champion.
          for seat in (0,1):
              for offset in range(40):
                  r=play(v20m,v19m.agent,seat,890000+offset,'v20_vs_v19')
                  rows.append(r); print(r)

          # Independent absolute-economics distributions.
          for label,module in (('v20',v20m),('v19',v19m),('v15',v15m)):
              games=40 if label!='v20' else 80
              per_seat=games//2
              for seat in (0,1):
                  for offset in range(per_seat):
                      r=play(module,'starter',seat,900000+offset,f'{label}_vs_starter')
                      rows.append(r); print(r)

          with Path('artifacts/v20_gate_results.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0])); w.writeheader(); w.writerows(rows)

          def q(values,p):
              values=sorted(values)
              if not values: return 0.0
              pos=(len(values)-1)*p; lo=math.floor(pos); hi=math.ceil(pos)
              if lo==hi: return float(values[lo])
              return float(values[lo]+(values[hi]-values[lo])*(pos-lo))

          def summary(group):
              rewards=[r['candidate_reward'] for r in group]
              return {
                  'games':len(group),
                  'wins':sum(r['result']=='win' for r in group),
                  'losses':sum(r['result']=='loss' for r in group),
                  'ties':sum(r['result']=='tie' for r in group),
                  'score_rate':sum(1 if r['result']=='win' else .5 if r['result']=='tie' else 0 for r in group)/len(group),
                  'mean_reward':statistics.fmean(rewards),
                  'median_reward':statistics.median(rewards),
                  'p10_reward':q(rewards,.10),'p90_reward':q(rewards,.90),'max_reward':max(rewards),
                  'ge_35000':sum(x>=35000 for x in rewards),
                  'ge_40000':sum(x>=40000 for x in rewards),
                  'ge_50000':sum(x>=50000 for x in rewards),
                  'mean_delta':statistics.fmean(r['delta'] for r in group),
                  'seat0_delta':statistics.fmean(r['delta'] for r in group if r['seat']==0),
                  'seat1_delta':statistics.fmean(r['delta'] for r in group if r['seat']==1),
                  'invalid':sum(r['candidate_status'] in BAD for r in group),
                  'max_weed_ratio':max(r['max_weed_ratio'] for r in group),
                  'games_with_2_animals':sum(r['max_active_animals']>=2 for r in group),
                  'games_with_2_land':sum(r['max_unlocked']>=2 for r in group),
              }

          d15=summary([r for r in rows if r['series']=='v20_vs_v15'])
          d19=summary([r for r in rows if r['series']=='v20_vs_v19'])
          s20=summary([r for r in rows if r['series']=='v20_vs_starter'])
          s19=summary([r for r in rows if r['series']=='v19_vs_starter'])
          s15=summary([r for r in rows if r['series']=='v15_vs_starter'])
          ratio15=s20['mean_reward']/max(1.0,s15['mean_reward'])
          ratio19=s20['mean_reward']/max(1.0,s19['mean_reward'])
          animal_execution_ok=(expected_animals<2 or s20['games_with_2_animals']>=40)

          promotion=(
              d15['invalid']==0 and d19['invalid']==0 and s20['invalid']==0 and
              d15['score_rate']>=0.55 and d15['mean_delta']>0 and
              d15['seat0_delta']>=0 and d15['seat1_delta']>=0 and
              d19['score_rate']>=0.48 and d19['mean_delta']>=-150 and
              s20['mean_reward']>=34000 and s20['median_reward']>=33000 and
              s20['p10_reward']>=29000 and s20['p90_reward']>=38000 and
              s20['ge_40000']>=5 and ratio15>=1.08 and ratio19>=1.02 and
              s20['max_weed_ratio']<=0.35 and animal_execution_ok
          )

          report={
              'version':'20.0.0-rc1',
              'selected_archetype':oracle['selected_archetype'],
              'selected_statistics':oracle['selected_statistics'],
              'selected_profile':oracle['selected_profile'],
              'direct_v20_vs_v15':d15,
              'direct_v20_vs_v19':d19,
              'v20_vs_starter':s20,'v19_vs_starter':s19,'v15_vs_starter':s15,
              'mean_reward_ratio_vs_v15':ratio15,
              'mean_reward_ratio_vs_v19':ratio19,
              'animal_execution_ok':animal_execution_ok,
              'promotion_recommended':promotion,
          }
          Path('artifacts/v20_gate_report.json').write_text(json.dumps(report,indent=2))
          Path('artifacts/PROMOTE').write_text('1' if promotion else '0')
          print(json.dumps(report,indent=2))
          PY

      - name: Build standalone candidate only if promoted
        run: |
          python - <<'PY'
          from pathlib import Path
          if Path('artifacts/PROMOTE').read_text().strip()!='1':
              print('V20 did not clear the replay-oracle economic gate; no submission produced.')
              raise SystemExit(0)
          import agents.v15_champion as base
          source=Path('dist/v20_candidate.py').read_text()
          replacement=(
              'import base64, types, zlib\n'
              '_v15 = types.ModuleType("_v15_embedded")\n'
              f'_V15_PAYLOAD = {base._PAYLOAD!r}\n'
              'exec(zlib.decompress(base64.b64decode(_V15_PAYLOAD)).decode("utf-8"), _v15.__dict__, _v15.__dict__)'
          )
          source=source.replace('from agents import v15_champion as _v15',replacement)
          Path('dist/main.py').write_text(source)
          PY
          if [ -f dist/main.py ]; then
            python -m py_compile dist/main.py
            ! grep -Eq 'from agents|import agents' dist/main.py
          fi

      - name: Package evidence-approved V20
        run: |
          if [ "$(cat artifacts/PROMOTE)" != "1" ]; then exit 0; fi
          (cd dist && zip -9 ../kaggriculture_adaptive_v20.0.0-rc1_submission.zip main.py)
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          z=Path('kaggriculture_adaptive_v20.0.0-rc1_submission.zip')
          with zipfile.ZipFile(z) as f: assert f.namelist()==['main.py']
          report=json.loads(Path('artifacts/v20_gate_report.json').read_text())
          manifest={
              'version':'20.0.0-rc1',
              'selected_archetype':report['selected_archetype'],
              'submission_sha256':hashlib.sha256(z.read_bytes()).hexdigest(),
              'main_sha256':hashlib.sha256(Path('dist/main.py').read_bytes()).hexdigest(),
              'promotion_recommended':True,
          }
          Path('release_manifest_v20.0.0-rc1.json').write_text(json.dumps(manifest,indent=2))
          Path('RELEASE_NOTES_v20.0.0-rc1.md').write_text(
              '# Kaggriculture v20.0.0-rc1\n\n'
              'Single replay-oracle experiment. The strategy archetype and executor parameters were derived only from real fit-window Kaggle replay trajectories; outer replays were not used for selection.\n\n'
              + json.dumps(report,indent=2)
          )
          PY

      - name: Upload oracle and tournament evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v20-replay-oracle-gate
          path: |
            artifacts/strategy_oracle.json
            artifacts/v20_gate_results.csv
            artifacts/v20_gate_report.json
            artifacts/PROMOTE
            replay_db/summary.json
            replay_db/index.csv
            raw_kaggle_replays/harvest_summary.json
            dist/v20_candidate.py
            dist/main.py
            kaggriculture_adaptive_v20.0.0-rc1_submission.zip
            RELEASE_NOTES_v20.0.0-rc1.md
            release_manifest_v20.0.0-rc1.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Enforce replay-oracle promotion gate
        if: always()
        run: |
          test -f artifacts/PROMOTE
          test "$(cat artifacts/PROMOTE)" = "1"
