name: run-v34-20-reserve-pasture-active8
on:
  push:
    branches: [agent/v34.20-reserve-pasture-active8-isolated]
    paths:
      - 'agents/v34_20_reserve_pasture_active8_isolated.py'
      - '.github/workflows/run-v34-20-reserve-pasture-active8.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with: {ref: agent/v34.20-reserve-pasture-active8-isolated, path: candidate}
      - uses: actions/checkout@v6
        with: {ref: agent/v32.4-surplus-land, path: control}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: pip install -q kaggle-environments
      - name: Compile
        run: |
          python -m py_compile candidate/agents/v34_17_late_cow_activation_rescue.py candidate/agents/v34_20_reserve_pasture_active8_isolated.py
          python -m py_compile control/agents/v19_2_early_scale8.py
      - name: Run isolated 24-game both-seat gate
        run: |
          python - <<'PY'
          import json,statistics,subprocess,sys
          from pathlib import Path
          CHILD=r'''
          import importlib,json,sys,os
          from kaggle_environments import make
          root,mod,seed,seat=sys.argv[1],sys.argv[2],int(sys.argv[3]),int(sys.argv[4]);sys.path.insert(0,root);os.chdir(root)
          a=importlib.import_module(mod)
          if hasattr(a,'reset_state'):a.reset_state()
          env=make('kaggriculture',configuration={'seed':seed},debug=False)
          env.run([a.agent,'starter'] if seat==0 else ['starter',a.agent])
          st=env.state[seat];tel=a.get_telemetry() if hasattr(a,'get_telemetry') else []
          peaks={'cows':0,'active_cows':0,'pastures':0,'hands':0,'productive':0,'lands':0};cash={16:0,18:0,20:0,22:0,25:0}
          for r in tel:
            if not isinstance(r,dict):continue
            for k in peaks:peaks[k]=max(peaks[k],int(r.get(k,0) or 0))
            d=int(r.get('day',-1) or -1)
            if d in cash:cash[d]=float(r.get('money',0) or 0)
          trig=a.reserve8_triggered() if hasattr(a,'reserve8_triggered') else False
          print('RESULTJSON='+json.dumps({'status':str(st.status),'reward':float(st.reward or 0),'peaks':peaks,'cash':cash,'trigger':bool(trig)},separators=(',',':')))
          '''
          def one(root,mod,seed,seat):
            try:p=subprocess.run([sys.executable,'-c',CHILD,root,mod,str(seed),str(seat)],text=True,capture_output=True,timeout=150)
            except subprocess.TimeoutExpired:return {'status':'TIMEOUT','reward':0.0,'peaks':{},'cash':{},'trigger':False}
            line=next((x for x in reversed(p.stdout.splitlines()) if x.startswith('RESULTJSON=')),None)
            if p.returncode or not line:return {'status':'ERROR','reward':0.0,'peaks':{},'cash':{},'trigger':False,'stderr':(p.stderr+p.stdout)[-2000:]}
            return json.loads(line.split('=',1)[1])
          rows=[]
          for seed in range(342000,342012):
            for seat in (0,1):
              c=one('candidate','agents.v34_20_reserve_pasture_active8_isolated',seed,seat)
              p=one('candidate','agents.v34_17_late_cow_activation_rescue',seed,seat)
              b=one('control','agents.v19_2_early_scale8',seed,seat)
              rows.append({'seed':seed,'seat':seat,'candidate':c,'parent_v34_17':p,'control_v19_2':b,'delta_parent':c['reward']-p['reward'],'delta_control':c['reward']-b['reward']})
          def summ(key):
            rs=[x[key] for x in rows];rw=[float(r.get('reward',0) or 0) for r in rs];s=sorted(rw)
            out={'games':len(rs),'invalid':sum(str(r.get('status')) in ('ERROR','INVALID','TIMEOUT') for r in rs),'mean':statistics.mean(rw),'median':statistics.median(rw),'min':min(rw),'p10':s[2],'p25':s[5],'p75':s[-6],'p90':s[-3],'max':max(rw)}
            if key=='candidate':
              for m in ('cows','active_cows','pastures','hands','productive','lands'):out['median_peak_'+m]=statistics.median(float((r.get('peaks') or {}).get(m,0) or 0) for r in rs)
              out['trigger_games']=sum(bool(r.get('trigger')) for r in rs)
              for d in (16,18,20,22,25):out['median_d'+str(d)+'_money']=statistics.median(float((r.get('cash') or {}).get(str(d),(r.get('cash') or {}).get(d,0)) or 0) for r in rs)
            return out
          c=summ('candidate');p=summ('parent_v34_17');b=summ('control_v19_2');dp=[x['delta_parent'] for x in rows];db=[x['delta_control'] for x in rows]
          report={'version':'34.20.0-reserve-pasture-active8-isolated','mechanism':'V34.17 unchanged except reserve-pasture forward buffer activates at 8 active cows instead of 10; all day/cash/health/labour/animal gates unchanged','candidate':c,'parent_v34_17':p,'control_v19_2':b,'paired_parent':{'wins':sum(x>0 for x in dp),'losses':sum(x<0 for x in dp),'ties':sum(x==0 for x in dp),'median_delta':statistics.median(dp)},'paired_control':{'wins':sum(x>0 for x in db),'losses':sum(x<0 for x in db),'median_delta':statistics.median(db)},'ready_150k':c['invalid']==0 and c['games']>=24 and c['median']>=150000 and c['min']>=100000,'games_detail':rows}
          Path('/tmp/v3420.json').write_text(json.dumps(report,indent=2));print(json.dumps({k:v for k,v in report.items() if k!='games_detail'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: v34-20-reserve-pasture-active8, path: /tmp/v3420.json, if-no-files-found: ignore, retention-days: 14}
