name: v22-frontier-clone

on:
  push:
    branches:
      - agent/adaptive-replay-lab-final
    paths:
      - 'agents/v15_champion.py'
      - 'agents/v19_livestock_compound.py'
      - 'agents/v22_frontier_clone.py'
      - '.github/workflows/v22-frontier-clone.yml'
  pull_request:
    paths:
      - 'agents/v15_champion.py'
      - 'agents/v19_livestock_compound.py'
      - 'agents/v22_frontier_clone.py'
      - '.github/workflows/v22-frontier-clone.yml'
  workflow_dispatch:

jobs:
  frontier-reproduction-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install simulator
        run: |
          python -m pip install --upgrade pip
          pip install kaggle-environments

      - name: Compile frontier clone
        run: |
          python -m py_compile agents/v15_champion.py agents/v19_livestock_compound.py agents/v22_frontier_clone.py

      - name: Run frontier reproduction tournament
        run: |
          mkdir -p artifacts dist
          python - <<'PY'
          import csv, importlib.util, json, math, statistics, time
          from pathlib import Path
          from kaggle_environments import make

          BAD={'ERROR','INVALID','TIMEOUT'}

          def load(path,name):
              spec=importlib.util.spec_from_file_location(name,path)
              mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
              return mod

          v22=load('agents/v22_frontier_clone.py','v22_candidate')
          v19=load('agents/v19_livestock_compound.py','v19_reference')

          def reset(mod):
              fn=getattr(mod,'reset_state',None)
              if callable(fn): fn()

          def telemetry(mod):
              fn=getattr(mod,'get_telemetry',None)
              if not callable(fn): return []
              try: rows=fn(clear=True)
              except TypeError: rows=fn()
              return rows if isinstance(rows,list) else []

          def first_day(rows,key,predicate):
              days=[int(r.get('day',99)) for r in rows if predicate(r.get(key,0))]
              return min(days) if days else 99

          def play(mod,reference,seat,seed,series):
              reset(mod)
              env=make('kaggriculture',configuration={'seed':seed},debug=True)
              agents=[mod.agent,reference] if seat==0 else [reference,mod.agent]
              started=time.perf_counter(); env.run(agents); runtime=time.perf_counter()-started
              mine=env.state[seat]; other=env.state[1-seat]
              reward=float(mine.reward or 0); ref=float(other.reward or 0)
              tele=telemetry(mod)
              return {
                  'series':series,'seat':seat,'seed':seed,
                  'candidate_reward':reward,'reference_reward':ref,'delta':reward-ref,
                  'result':'win' if reward>ref else 'loss' if reward<ref else 'tie',
                  'candidate_status':str(mine.status),'reference_status':str(other.status),
                  'max_hands':max([int(r.get('hands',0) or 0) for r in tele] or [0]),
                  'max_land':max([int(r.get('land',0) or 0) for r in tele] or [0]),
                  'max_cows':max([int(r.get('cows',0) or 0) for r in tele] or [0]),
                  'max_sheep':max([int(r.get('sheep',0) or 0) for r in tele] or [0]),
                  'max_pastures':max([int(r.get('pastures',0) or 0) for r in tele] or [0]),
                  'max_strawberries':max([int(r.get('crop_strawberry',0) or 0) for r in tele] or [0]),
                  'max_active_animals':max([int(r.get('active_animals',0) or 0) for r in tele] or [0]),
                  'land2_day':first_day(tele,'land',lambda x:int(x or 0)>=2),
                  'land3_day':first_day(tele,'land',lambda x:int(x or 0)>=3),
                  'full_herd_day':min([int(r.get('day',99)) for r in tele if int(r.get('cows',0) or 0)>=8 and int(r.get('sheep',0) or 0)>=6] or [99]),
                  'runtime_seconds':runtime,
              }

          rows=[]
          # Primary objective: absolute money distribution.  Town RNG is coupled,
          # so controls are distributional, not paired counterfactual claims.
          for seat in (0,1):
              for offset in range(40):
                  r=play(v22,'starter',seat,940000+offset,'v22_vs_starter')
                  rows.append(r); print(r)

          # V19 distribution control on independent games.
          for seat in (0,1):
              for offset in range(20):
                  r=play(v19,'starter',seat,950000+offset,'v19_vs_starter')
                  rows.append(r); print(r)

          # Pairwise sanity check: a true frontier clone should dominate the 50k
          # architecture rather than merely score well against starter.
          for seat in (0,1):
              for offset in range(20):
                  r=play(v22,v19.agent,seat,960000+offset,'v22_vs_v19')
                  rows.append(r); print(r)

          with Path('artifacts/v22_frontier_results.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0])); w.writeheader(); w.writerows(rows)

          def q(values,p):
              vals=sorted(float(x) for x in values)
              if not vals:return 0.0
              x=(len(vals)-1)*p; lo=math.floor(x); hi=math.ceil(x)
              if lo==hi:return vals[lo]
              return vals[lo]+(vals[hi]-vals[lo])*(x-lo)

          def summary(group):
              rewards=[r['candidate_reward'] for r in group]
              return {
                  'games':len(group),
                  'wins':sum(r['result']=='win' for r in group),
                  'losses':sum(r['result']=='loss' for r in group),
                  'ties':sum(r['result']=='tie' for r in group),
                  'score_rate':sum(1 if r['result']=='win' else .5 if r['result']=='tie' else 0 for r in group)/len(group),
                  'mean_reward':statistics.fmean(rewards),
                  'median_reward':statistics.median(rewards),
                  'p10_reward':q(rewards,.10),'p90_reward':q(rewards,.90),'max_reward':max(rewards),
                  'ge_150k':sum(x>=150000 for x in rewards),
                  'ge_175k':sum(x>=175000 for x in rewards),
                  'ge_185k':sum(x>=185000 for x in rewards),
                  'ge_190k':sum(x>=190000 for x in rewards),
                  'ge_200k':sum(x>=200000 for x in rewards),
                  'mean_delta':statistics.fmean(r['delta'] for r in group),
                  'seat0_delta':statistics.fmean(r['delta'] for r in group if r['seat']==0),
                  'seat1_delta':statistics.fmean(r['delta'] for r in group if r['seat']==1),
                  'invalid':sum(r['candidate_status'] in BAD for r in group),
                  'games_3_land':sum(r['max_land']>=3 for r in group),
                  'games_14_animals':sum(r['max_cows']>=8 and r['max_sheep']>=6 for r in group),
                  'games_12_hands':sum(r['max_hands']>=12 for r in group),
                  'games_35_strawberries':sum(r['max_strawberries']>=35 for r in group),
                  'median_land2_day':statistics.median(r['land2_day'] for r in group),
                  'median_land3_day':statistics.median(r['land3_day'] for r in group),
                  'median_full_herd_day':statistics.median(r['full_herd_day'] for r in group),
              }

          s22=summary([r for r in rows if r['series']=='v22_vs_starter'])
          s19=summary([r for r in rows if r['series']=='v19_vs_starter'])
          direct=summary([r for r in rows if r['series']=='v22_vs_v19'])
          ratio=s22['mean_reward']/max(1.0,s19['mean_reward'])

          # Reproduction gate, not the eventual 200k promotion gate.  V22 must
          # first demonstrate that it lives in the real public frontier regime.
          promote=(
              s22['invalid']==0 and direct['invalid']==0 and
              s22['median_reward']>=155000 and s22['p10_reward']>=130000 and
              s22['p90_reward']>=175000 and s22['max_reward']>=185000 and
              s22['ge_175k']>=8 and s22['ge_190k']>=1 and
              s22['games_3_land']>=72 and s22['games_14_animals']>=68 and
              s22['games_12_hands']>=72 and s22['games_35_strawberries']>=60 and
              s22['median_land2_day']<=8 and s22['median_land3_day']<=11 and
              s22['median_full_herd_day']<=13 and
              direct['score_rate']>=0.90 and direct['mean_delta']>50000 and
              ratio>=2.5
          )

          report={
              'version':'22.0.0-rc1',
              'objective':'reproduce public 175k-192k frontier before >200k mutation',
              'frontier_reference':{
                  'top50_median':180294,'top50_p10':175842.4,'public_max':192291,
                  'structure':'3 land / 8 cows / 6 sheep / 12 hands / ~40 strawberries'
              },
              'v22_vs_starter':s22,'v19_vs_starter':s19,'v22_vs_v19':direct,
              'mean_reward_ratio_vs_v19':ratio,
              'reproduction_gate_passed':promote,
          }
          Path('artifacts/v22_frontier_report.json').write_text(json.dumps(report,indent=2))
          Path('artifacts/PROMOTE').write_text('1' if promote else '0')
          print(json.dumps(report,indent=2))
          PY

      - name: Build standalone only if frontier reproduced
        run: |
          python - <<'PY'
          from pathlib import Path
          if Path('artifacts/PROMOTE').read_text().strip()!='1':
              print('V22 did not reproduce the frontier; no submission produced.')
              raise SystemExit(0)
          import agents.v15_champion as base
          source=Path('agents/v22_frontier_clone.py').read_text()
          replacement=(
              'import base64, types, zlib\n'
              '_v15 = types.ModuleType("_v15_embedded")\n'
              f'_V15_PAYLOAD = {base._PAYLOAD!r}\n'
              'exec(zlib.decompress(base64.b64decode(_V15_PAYLOAD)).decode("utf-8"), _v15.__dict__, _v15.__dict__)'
          )
          source=source.replace('from agents import v15_champion as _v15',replacement)
          Path('dist/main.py').write_text(source)
          PY
          if [ -f dist/main.py ]; then
            python -m py_compile dist/main.py
            ! grep -Eq 'from agents|import agents' dist/main.py
          fi

      - name: Package evidence-approved V22
        run: |
          if [ "$(cat artifacts/PROMOTE)" != "1" ]; then exit 0; fi
          (cd dist && zip -9 ../kaggriculture_adaptive_v22.0.0-rc1_submission.zip main.py)
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          z=Path('kaggriculture_adaptive_v22.0.0-rc1_submission.zip')
          with zipfile.ZipFile(z) as f: assert f.namelist()==['main.py']
          report=json.loads(Path('artifacts/v22_frontier_report.json').read_text())
          manifest={
              'version':'22.0.0-rc1','reproduction_gate_passed':True,
              'submission_sha256':hashlib.sha256(z.read_bytes()).hexdigest(),
              'main_sha256':hashlib.sha256(Path('dist/main.py').read_bytes()).hexdigest(),
              'public_frontier_max_reference':192291,
          }
          Path('release_manifest_v22.0.0-rc1.json').write_text(json.dumps(manifest,indent=2))
          Path('RELEASE_NOTES_v22.0.0-rc1.md').write_text(
              '# Kaggriculture v22.0.0-rc1\n\n'
              'Replay-frontier reproduction build: 3 districts, 8 cows, 6 sheep, 12 hands, strawberry-heavy crop portfolio, fertilizer service, terminal liquidation.\n\n'
              + json.dumps(report,indent=2)
          )
          PY

      - name: Upload frontier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v22-frontier-clone-gate
          path: |
            artifacts/v22_frontier_results.csv
            artifacts/v22_frontier_report.json
            artifacts/PROMOTE
            dist/main.py
            kaggriculture_adaptive_v22.0.0-rc1_submission.zip
            RELEASE_NOTES_v22.0.0-rc1.md
            release_manifest_v22.0.0-rc1.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Enforce frontier reproduction gate
        if: always()
        run: |
          test -f artifacts/PROMOTE
          test "$(cat artifacts/PROMOTE)" = "1"
