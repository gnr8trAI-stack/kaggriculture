name: benchmark-v33-industrial
on:
  push:
    branches: ['agent/v33-industrial']
    paths:
      - 'agents/v33_industrial.py'
      - 'agents/v33_industrial_v14.py'
      - '.github/workflows/benchmark-v33-industrial.yml'
      - 'docs/V33_INDUSTRIAL_SPEC.md'
permissions:
  contents: read
  issues: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v33-industrial
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -q kaggle-environments
      - name: Compile candidate
        run: python -m py_compile agents/v33_industrial.py agents/v33_industrial_v14.py
      - name: Clean file-agent smoke both seats
        run: |
          mkdir -p /tmp/v33clean/agents
          cp agents/v33_industrial.py agents/v33_industrial_v14.py /tmp/v33clean/agents/
          touch /tmp/v33clean/agents/__init__.py
          cat > /tmp/v33clean/agent.py <<'PY'
          from agents.v33_industrial_v14 import agent
          PY
          cd /tmp/v33clean
          python - <<'PY'
          from kaggle_environments import make
          for seat in (0,1):
              env=make('kaggriculture',configuration={'seed':3314900+seat},debug=True)
              env.run(['agent.py','starter'] if seat==0 else ['starter','agent.py'])
              st=env.state[seat]
              print(seat,st.status,st.reward)
              assert str(st.status) not in {'ERROR','INVALID','TIMEOUT'}
          PY
      - name: Industrial benchmark both seats
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json,statistics
          from pathlib import Path
          from kaggle_environments import make
          import agents.v33_industrial_v14 as a
          rows=[]
          seeds=range(331400,331412)
          for seat in (0,1):
            for seed in seeds:
              a.reset_state()
              env=make('kaggriculture',configuration={'seed':seed},debug=True)
              env.run([a.agent,'starter'] if seat==0 else ['starter',a.agent])
              st=env.state[seat]; tele=a.get_telemetry(clear=True) or []
              def snap(day):
                r=[x for x in tele if int(x.get('day',-1))<=day]
                if not r: return {'money':0,'productive':0,'lands':0,'hands':0,'animals':0}
                x=r[-1]
                return {k:x.get(k,0) for k in ('money','productive','lands','hands','animals')}
              def peak(key): return max([int(x.get(key,0) or 0) for x in tele] or [0])
              def peakq(q,key): return max([int((x.get(f'q{q}') or {}).get(key,0) or 0) for x in tele] or [0])
              final=tele[-1] if tele else {}
              rows.append({
                'seat':seat,'seed':seed,'reward':float(st.reward or 0),'status':str(st.status),
                'd12':snap(12),'d20':snap(20),'d25':snap(25),
                'max_lands':peak('lands'),'max_hands':peak('hands'),'max_animals':peak('animals'),
                'max_productive':peak('productive'),'max_idle':peak('idle'),
                'q3_productive':peakq(3,'productive'),'q4_productive':peakq(4,'productive'),
                'q3_animals':peakq(3,'animals'),'q4_animals':peakq(4,'animals'),
                'final':final,
              })
          Path('artifacts/v33_v14_rows.json').write_text(json.dumps(rows,indent=2))
          BAD={'ERROR','INVALID','TIMEOUT'}
          rewards=[r['reward'] for r in rows]; sr=sorted(rewards)
          report={
            'version':'33.14.0-sequential-commissioning','games':len(rows),
            'mean_reward':statistics.fmean(rewards),'median_reward':statistics.median(rewards),
            'min_reward':min(rewards),'p10_reward':sr[max(0,int(len(sr)*.10)-1)],
            'p25_reward':statistics.median(sr[:max(1,len(sr)//2)]),'max_reward':max(rewards),
            'invalid':sum(r['status'] in BAD for r in rows),
            'median_d12_money':statistics.median(float(r['d12'].get('money',0) or 0) for r in rows),
            'median_d20_money':statistics.median(float(r['d20'].get('money',0) or 0) for r in rows),
            'median_d25_money':statistics.median(float(r['d25'].get('money',0) or 0) for r in rows),
            'median_peak_productive':statistics.median(r['max_productive'] for r in rows),
            'median_peak_animals':statistics.median(r['max_animals'] for r in rows),
            'median_peak_hands':statistics.median(r['max_hands'] for r in rows),
            'four_land_games':sum(r['max_lands']>=4 for r in rows),
            'q3_live_games':sum(r['q3_productive']>0 for r in rows),
            'q4_live_games':sum(r['q4_productive']>0 for r in rows),
            'q3_animal_games':sum(r['q3_animals']>0 for r in rows),
            'q4_animal_games':sum(r['q4_animals']>0 for r in rows),
          }
          report['stage_a_pass']=(report['invalid']==0 and report['q3_live_games']>=20 and report['q4_live_games']>=12)
          report['ready_150k']=(report['games']>=24 and report['invalid']==0 and report['median_reward']>=150000 and report['min_reward']>=100000)
          Path('artifacts/v33_v14_report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Post internal benchmark evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f artifacts/v33_v14_report.json ]; then
            { echo '## V33.14 Industrial benchmark'; echo; echo '```json'; cat artifacts/v33_v14_report.json; echo '```'; } > /tmp/report.md
          else
            echo '## V33.14 Industrial benchmark failed before report generation' > /tmp/report.md
          fi
          gh issue comment 16 --repo "$GITHUB_REPOSITORY" --body-file /tmp/report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v33-industrial-v14
          path: artifacts/
          retention-days: 14
