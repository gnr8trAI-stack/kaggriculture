name: run-v34-18-reserve-window27-isolated
on:
  push:
    branches: ['agent/v34.18-late-third-district']
    paths: ['.github/workflows/run-v34-18-reserve-window27-isolated.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout V19.2 control
        uses: actions/checkout@v6
        with:
          ref: agent/v32.4-surplus-land
          path: baseline
      - name: Checkout V34.17 prior
        uses: actions/checkout@v6
        with:
          ref: agent/v34.17-late-cow-activation-rescue
          path: prior
      - name: Checkout V34.18 candidate
        uses: actions/checkout@v6
        with:
          ref: agent/v34.18-late-third-district
          path: candidate
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -q kaggle-environments
      - name: Compile
        run: |
          python -m py_compile baseline/agents/v19_2_early_scale8.py
          python -m py_compile prior/agents/v34_17_late_cow_activation_rescue.py
          python -m py_compile candidate/agents/v34_18_reserve_window27_isolated.py
      - name: Run isolated benchmark
        run: |
          python - <<'PY'
          import json, statistics, subprocess, sys
          from pathlib import Path
          CHILD=r'''
          import importlib,json,sys,os
          from kaggle_environments import make
          root,mod,seed,seat=sys.argv[1],sys.argv[2],int(sys.argv[3]),int(sys.argv[4])
          sys.path.insert(0,root); os.chdir(root); a=importlib.import_module(mod)
          if hasattr(a,'reset_state'): a.reset_state()
          env=make('kaggriculture',configuration={'seed':seed},debug=False)
          env.run([a.agent,'starter'] if seat==0 else ['starter',a.agent])
          st=env.state[seat]; tel=a.get_telemetry() if hasattr(a,'get_telemetry') else []; final=tel[-1] if tel else {}
          def peak(k): return max([int(r.get(k,0) or 0) for r in tel] or [0])
          print('RESULTJSON='+json.dumps({'status':str(st.status),'reward':float(st.reward or 0),'peak_cows':peak('cow_count'),'peak_active_cows':peak('active_cows'),'peak_pastures':peak('pastures'),'unlocked_count':int(final.get('unlocked_count',0) or 0),'final_money':float(final.get('money',0) or 0),'triggered':bool(a.reserve_window_triggered()) if hasattr(a,'reserve_window_triggered') else False},separators=(',',':')))
          '''
          def one(root,mod,seed,seat):
            try:p=subprocess.run([sys.executable,'-c',CHILD,root,mod,str(seed),str(seat)],text=True,capture_output=True,timeout=170)
            except subprocess.TimeoutExpired:return {'status':'TIMEOUT','reward':0.0}
            line=next((x for x in reversed(p.stdout.splitlines()) if x.startswith('RESULTJSON=')),None)
            if p.returncode or not line:return {'status':'ERROR','reward':0.0,'stderr':(p.stderr+p.stdout)[-1200:]}
            return json.loads(line.split('=',1)[1])
          rows=[]
          for seed in range(341800,341812):
            for seat in (0,1):
              b=one('baseline','agents.v19_2_early_scale8',seed,seat); p=one('prior','agents.v34_17_late_cow_activation_rescue',seed,seat); c=one('candidate','agents.v34_18_reserve_window27_isolated',seed,seat)
              rows.append({'seed':seed,'seat':seat,'baseline':b,'prior_v34_17':p,'candidate':c,'delta_vs_v19':c['reward']-b['reward'],'delta_vs_v34_17':c['reward']-p['reward']})
          def summ(k):
            rs=[x[k] for x in rows]; r=[float(x.get('reward',0) or 0) for x in rs]; sr=sorted(r)
            med=lambda f: statistics.median(float(x.get(f,0) or 0) for x in rs)
            return {'games':len(rs),'invalid':sum(str(x.get('status')) in ('ERROR','INVALID','TIMEOUT') for x in rs),'mean':statistics.mean(r),'median':statistics.median(r),'min':min(r),'p10':sr[2],'p25':sr[5],'p75':sr[17],'p90':sr[-3],'max':max(r),'median_peak_cows':med('peak_cows'),'median_peak_active_cows':med('peak_active_cows'),'median_peak_pastures':med('peak_pastures'),'median_final_money':med('final_money'),'trigger_games':sum(bool(x.get('triggered')) for x in rs)}
          bs,ps,cs=summ('baseline'),summ('prior_v34_17'),summ('candidate'); d19=[x['delta_vs_v19'] for x in rows]; d17=[x['delta_vs_v34_17'] for x in rows]
          report={'version':'34.18.0-reserve-window27-isolated','mechanism':'V34.17 unchanged except reserve-pasture commissioning remains eligible through day 27 instead of day 23','baseline_v19_2':bs,'prior_v34_17':ps,'candidate':cs,'paired_vs_v19':{'wins':sum(x>0 for x in d19),'losses':sum(x<0 for x in d19),'median_delta':statistics.median(d19)},'paired_vs_v34_17':{'wins':sum(x>0 for x in d17),'losses':sum(x<0 for x in d17),'median_delta':statistics.median(d17)},'ready_150k':cs['invalid']==0 and cs['games']>=24 and cs['median']>=150000 and cs['min']>=100000,'games_detail':rows}
          Path('/tmp/v3418.json').write_text(json.dumps(report,indent=2)); print(json.dumps({k:v for k,v in report.items() if k!='games_detail'},indent=2))
          PY
      - name: Record issue 16
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '## V34.18 isolated reserve-window benchmark'; echo; echo '```json'; cat /tmp/v3418.json 2>/dev/null || echo '{"error":"no report"}'; echo '```'; } >/tmp/v3418.md
          gh issue comment 16 --repo "$GITHUB_REPOSITORY" --body-file /tmp/v3418.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v34-18-reserve-window27-isolated
          path: /tmp/v3418.json
          retention-days: 14
