name: package-v34-5-kaggle-ready
on:
  push:
    branches: [main]
    paths: ['.github/workflows/run-v34-3-cow12-crew6-isolated.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Announce start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 16 --repo "$GITHUB_REPOSITORY" --body "## V34.5 Kaggle-ready packaging started\n\nRun: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\n\nNo Kaggle submission step."
      - uses: actions/checkout@v6
        with:
          ref: agent/v34.5-cow16-crew6-isolated
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Kaggle environment
        run: pip install -q kaggle-environments
      - name: Build exact-chain standalone
        run: |
          mkdir -p dist
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          mods = [
              ('agents.v15_champion','agents/v15_champion.py'),
              ('agents.v19_livestock_compound','agents/v19_livestock_compound.py'),
              ('agents.v19_2_early_scale8','agents/v19_2_early_scale8.py'),
              ('agents.v34_2_cow12_crew4_isolated','agents/v34_2_cow12_crew4_isolated.py'),
              ('agents.v34_3_cow12_crew6_isolated','agents/v34_3_cow12_crew6_isolated.py'),
              ('agents.v34_5_cow16_crew6_isolated','agents/v34_5_cow16_crew6_isolated.py'),
          ]
          payloads=[]
          for name,path in mods:
              src=Path(path).read_text(encoding='utf-8')
              payloads.append((name,base64.b64encode(zlib.compress(src.encode(),9)).decode()))
          out=[
              '# V34.5 cow16/crew6 standalone Kaggriculture submission',
              'import sys, types, base64, zlib',
              "agents=types.ModuleType('agents')",
              "agents.__path__=[]",
              "sys.modules['agents']=agents",
              f'_PAYLOADS={payloads!r}',
              'for _name,_blob in _PAYLOADS:',
              '    _mod=types.ModuleType(_name)',
              "    _mod.__package__='agents'",
              '    sys.modules[_name]=_mod',
              "    setattr(agents,_name.rsplit('.',1)[1],_mod)",
              "    exec(compile(zlib.decompress(base64.b64decode(_blob)).decode('utf-8'),'<embedded:'+_name+'>','exec'),_mod.__dict__)",
              "agent=sys.modules['agents.v34_5_cow16_crew6_isolated'].agent",
          ]
          p=Path('dist/kaggriculture_v34.5_cow16_crew6_standalone.py')
          p.write_text('\n'.join(out)+'\n',encoding='utf-8')
          print(p,p.stat().st_size)
          PY
          python -m py_compile dist/kaggriculture_v34.5_cow16_crew6_standalone.py
      - name: Exact Kaggle file-agent smoke test both seats
        run: |
          rm -rf /tmp/v345clean && mkdir /tmp/v345clean
          cp dist/kaggriculture_v34.5_cow16_crew6_standalone.py /tmp/v345clean/submission.py
          cd /tmp/v345clean
          python - <<'PY'
          from kaggle_environments import make
          for seed,seat in ((345901,0),(345902,1)):
              env=make('kaggriculture',configuration={'seed':seed},debug=True)
              env.run(['submission.py','starter'] if seat==0 else ['starter','submission.py'])
              st=env.state[seat]
              print('seed',seed,'seat',seat,'status',st.status,'reward',st.reward)
              assert str(st.status) not in {'ERROR','INVALID','TIMEOUT'}
          PY
      - name: Record success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(sha256sum dist/kaggriculture_v34.5_cow16_crew6_standalone.py | awk '{print $1}')
          size=$(wc -c < dist/kaggriculture_v34.5_cow16_crew6_standalone.py)
          gh issue comment 16 --repo "$GITHUB_REPOSITORY" --body "## V34.5 Kaggle-ready artifact PASS\n\nRun: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\n\nCompile PASS; exact Kaggle file-agent smoke PASS both seats. Size: ${size}. SHA256: ${sha}. No submission made."
      - uses: actions/upload-artifact@v4
        with:
          name: v34-5-kaggle-ready-standalone
          path: dist/kaggriculture_v34.5_cow16_crew6_standalone.py
          retention-days: 14
