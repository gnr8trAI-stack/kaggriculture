name: run-v34-3-cow12-crew6-isolated
on:
  push:
    branches: [main]
    paths: ['.github/workflows/run-v34-3-cow12-crew6-isolated.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout V19.2 control
        uses: actions/checkout@v6
        with:
          ref: agent/v32.4-surplus-land
          path: baseline
      - name: Checkout V34.3 candidate
        uses: actions/checkout@v6
        with:
          ref: agent/v34.3-cow12-crew6-isolated
          path: candidate
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install environment
        run: pip install -q kaggle-environments
      - name: Compile candidate and control
        run: |
          python -m py_compile candidate/agents/v34_3_cow12_crew6_isolated.py
          python -m py_compile baseline/agents/v19_2_early_scale8.py
      - name: Run isolated V19.2 control
        working-directory: baseline
        run: |
          python - <<'PY'
          import json
          from kaggle_environments import make
          import agents.v19_2_early_scale8 as a
          rows=[]
          for seed in range(343000,343016):
              for seat in (0,1):
                  a.reset_state()
                  env=make('kaggriculture', configuration={'seed':seed}, debug=False)
                  env.run([a.agent,'starter'] if seat==0 else ['starter',a.agent])
                  st=env.state[seat]
                  tel=a.get_telemetry(); last=tel[-1] if tel else {}
                  rows.append({'seed':seed,'seat':seat,'status':str(st.status),'reward':float(st.reward or 0),
                               'peak_cows':max([int(r.get('cow_count',0) or 0) for r in tel] or [0]),
                               'peak_active_cows':max([int(r.get('active_cows',0) or 0) for r in tel] or [0]),
                               'peak_pastures':max([int(r.get('pastures',0) or 0) for r in tel] or [0]),
                               'unlocked_count':int(last.get('unlocked_count',0) or 0)})
          open('/tmp/v343_base.json','w').write(json.dumps(rows))
          PY
      - name: Run isolated V34.3 candidate
        working-directory: candidate
        run: |
          python - <<'PY'
          import json
          from kaggle_environments import make
          import agents.v34_3_cow12_crew6_isolated as a
          rows=[]
          for seed in range(343000,343016):
              for seat in (0,1):
                  a.reset_state()
                  env=make('kaggriculture', configuration={'seed':seed}, debug=False)
                  env.run([a.agent,'starter'] if seat==0 else ['starter',a.agent])
                  st=env.state[seat]
                  tel=a.get_telemetry(); last=tel[-1] if tel else {}
                  rows.append({'seed':seed,'seat':seat,'status':str(st.status),'reward':float(st.reward or 0),
                               'peak_cows':max([int(r.get('cow_count',0) or 0) for r in tel] or [0]),
                               'peak_active_cows':max([int(r.get('active_cows',0) or 0) for r in tel] or [0]),
                               'peak_pastures':max([int(r.get('pastures',0) or 0) for r in tel] or [0]),
                               'unlocked_count':int(last.get('unlocked_count',0) or 0)})
          open('/tmp/v343_cand.json','w').write(json.dumps(rows))
          PY
      - name: Summarize paired benchmark
        run: |
          python - <<'PY'
          import json, statistics
          b=json.load(open('/tmp/v343_base.json')); c=json.load(open('/tmp/v343_cand.json'))
          def s(rows):
              r=[x['reward'] for x in rows]; sr=sorted(r)
              return {'games':len(rows),'invalid':sum(x['status'] in ('ERROR','INVALID','TIMEOUT') for x in rows),
                      'mean':statistics.mean(r),'median':statistics.median(r),'min':min(r),
                      'p10':sr[max(0,int(len(sr)*.1)-1)],'max':max(r),
                      'median_peak_cows':statistics.median(x['peak_cows'] for x in rows),
                      'median_peak_active_cows':statistics.median(x['peak_active_cows'] for x in rows),
                      'max_peak_active_cows':max(x['peak_active_cows'] for x in rows),
                      'active12_games':sum(x['peak_active_cows']>=12 for x in rows),
                      'median_peak_pastures':statistics.median(x['peak_pastures'] for x in rows),
                      'multi_land_games':sum(x['unlocked_count']>=2 for x in rows)}
          bs=s(b); cs=s(c); d=[c[i]['reward']-b[i]['reward'] for i in range(len(b))]
          report={'version':'34.3.0-cow12-crew6-isolated',
                  'mechanism':'V34.2 unchanged except dedicated livestock service crew 4->6',
                  'baseline_v19_2':bs,'candidate_v34_3':cs,
                  'paired':{'wins':sum(x>0 for x in d),'losses':sum(x<0 for x in d),'ties':sum(x==0 for x in d),
                            'mean_delta':statistics.mean(d),'median_delta':statistics.median(d)},
                  'ready_150k':cs['invalid']==0 and cs['games']>=24 and cs['median']>=150000 and cs['min']>=100000}
          open('/tmp/v343_report.json','w').write(json.dumps(report,indent=2)); print(json.dumps(report,indent=2))
          PY
      - name: Record result in issue 16
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '## V34.3 isolated six-hand livestock-service benchmark'; echo; echo '```json'; cat /tmp/v343_report.json 2>/dev/null || echo '{"error":"no report"}'; echo '```'; } > /tmp/v343.md
          gh issue comment 16 --repo "$GITHUB_REPOSITORY" --body-file /tmp/v343.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v34-3-cow12-crew6-isolated-benchmark
          path: /tmp/v343_report.json
          if-no-files-found: ignore
          retention-days: 14
