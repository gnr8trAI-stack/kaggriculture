name: economic-v3

on:
  push:
    branches:
      - agent/adaptive-replay-lab-final
    paths:
      - 'agents/v3_economic.py'
      - 'trainer/mine_economic_policy.py'
      - 'trainer/generate_v3_agent.py'
      - 'trainer/harvest_kaggle_replays.py'
      - 'trainer/ingest_replays.py'
      - 'scripts/benchmark_adaptive_population.py'
      - '.github/workflows/economic-v3.yml'
  pull_request:
    paths:
      - 'agents/v3_economic.py'
      - 'trainer/mine_economic_policy.py'
      - 'trainer/generate_v3_agent.py'
      - '.github/workflows/economic-v3.yml'
  workflow_dispatch:

jobs:
  validate-v3-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Compile v3 tooling
        run: |
          test -f agents/v3_economic.py
          test -f trainer/mine_economic_policy.py
          test -f trainer/generate_v3_agent.py
          python -m py_compile agents/v3_economic.py
          python -m py_compile trainer/mine_economic_policy.py
          python -m py_compile trainer/generate_v3_agent.py
          python -m py_compile trainer/harvest_kaggle_replays.py
          python -m py_compile trainer/ingest_replays.py
          python -m py_compile scripts/benchmark_adaptive_population.py

  replay-train-benchmark-package:
    needs: validate-v3-tooling
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      VERSION: 3.0.0-beta.1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Reclaim runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          sudo apt-get clean || true
          df -h /
      - name: Install Kaggle and simulator
        run: |
          python -m pip install --upgrade pip
          pip install kaggle kaggle-environments
      - name: Verify Kaggle authentication
        run: |
          test -n "$KAGGLE_API_TOKEN"
          echo 'Kaggle token is configured'
      - name: Harvest public ladder replays
        run: |
          python trainer/harvest_kaggle_replays.py --output raw_kaggle_replays
          df -h /
      - name: Build chronological replay index
        run: |
          python trainer/ingest_replays.py --input raw_kaggle_replays --output replay_db
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('replay_db/summary.json').read_text())
          assert s['unique_episodes'] > 0, s
          assert s.get('identity_coverage',0) >= 0.95, s
          assert s.get('fit_rows',0) > 0, s
          assert s.get('outer_rows',0) > 0, s
          print(json.dumps(s,indent=2))
          PY
      - name: Mine economic and farm-health policy from fit window
        run: |
          python trainer/mine_economic_policy.py --corpus replay_db --output artifacts/economic_policy.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/economic_policy.json').read_text())
          assert p['decisive_count'] >= 100, p
          assert p['primary_crop'] in {'WHEAT','CARROT','TOMATO','STRAWBERRY','MELON'}, p
          assert 0 < p['weed_soft_ratio'] < p['weed_hard_ratio'] < 0.30, p
          assert len(p['phases']) >= 4, p
          print('learned crop',p['primary_crop'],'animal',p['primary_animal'])
          print('weed guard',p['weed_soft_ratio'],p['weed_hard_ratio'])
          print(json.dumps(p['phases'],indent=2))
          PY
      - name: Generate standalone replay-trained v3
        run: |
          python trainer/generate_v3_agent.py --template agents/v3_economic.py --policy artifacts/economic_policy.json --output dist/main.py
          python -m py_compile dist/main.py
          ! grep -Eq 'from trainer|import trainer|from agents|import agents|from scripts|import scripts' dist/main.py
      - name: Smoke test both seats and inspect weeds
        run: |
          python - <<'PY'
          import importlib.util
          from kaggle_environments import make

          s=importlib.util.spec_from_file_location('v3','dist/main.py')
          m=importlib.util.module_from_spec(s); s.loader.exec_module(m)

          def weed_ratio(obs, seat):
              try:
                  farm=(obs.get('farms') or [])[seat]
                  tiles=farm.get('tiles') or []
              except Exception:
                  return None
              usable=weed=0
              for row in tiles:
                  for t in row:
                      if t == 'LOCKED' or (isinstance(t,dict) and str(t.get('kind','')).upper()=='LOCKED'):
                          continue
                      usable += 1
                      if isinstance(t,dict) and str(t.get('kind','')).upper()=='WEED':
                          weed += 1
              return weed/max(1,usable)

          max_seen=0.0
          samples=0
          for seed in (640001,640002):
              for seat in (0,1):
                  env=make('kaggriculture',configuration={'episodeSteps':720,'randomSeed':seed},debug=True)
                  env.run([m.agent,'starter'] if seat==0 else ['starter',m.agent])
                  mine=env.state[seat]
                  assert str(mine.status) not in {'ERROR','INVALID','TIMEOUT'}
                  for step in getattr(env,'steps',[]) or []:
                      try:
                          obs=step[seat].observation
                      except Exception:
                          continue
                      if not isinstance(obs,dict):
                          continue
                      r=weed_ratio(obs,seat)
                      if r is not None:
                          max_seen=max(max_seen,r); samples += 1
                  print('seed',seed,'seat',seat,[(x.reward,str(x.status)) for x in env.state])
          print({'weed_samples':samples,'max_weed_ratio':max_seen})
          if samples:
              assert max_seen <= 0.35, f'weed runaway: {max_seen:.3f}'
          PY
      - name: Benchmark against repository population
        run: |
          python scripts/benchmark_adaptive_population.py \
            --candidate dist/main.py \
            --opponent v2_frozen=agents/v2_frozen.py \
            --opponent adaptive_v2=agents/adaptive_agent.py \
            --games-per-seat 8 \
            --seed-start 650000 \
            --output artifacts/v3_population_results.csv
          python - <<'PY'
          import csv,json
          from pathlib import Path
          rows=list(csv.DictReader(Path('artifacts/v3_population_results.csv').open()))
          invalid=sum(r['candidate_status'] in {'ERROR','INVALID','TIMEOUT'} for r in rows)
          wins=sum(r['result']=='win' for r in rows); losses=sum(r['result']=='loss' for r in rows); ties=sum(r['result']=='tie' for r in rows)
          mean_delta=sum(float(r['delta']) for r in rows)/len(rows)
          winrate=wins/len(rows)
          report={'version':'3.0.0-beta.1','games':len(rows),'wins':wins,'losses':losses,'ties':ties,'invalid':invalid,'winrate':winrate,'mean_delta':mean_delta,'promotion_recommended': invalid==0 and winrate>=0.55 and mean_delta>0}
          Path('artifacts/v3_release_report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          assert invalid==0
          PY
      - name: Build release notes and Kaggle package
        run: |
          mkdir -p release
          cp dist/main.py release/main.py
          (cd release && zip -9 ../kaggriculture_adaptive_v${VERSION}_submission.zip main.py)
          python - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          version=os.environ['VERSION']
          policy=json.loads(Path('artifacts/economic_policy.json').read_text())
          bench=json.loads(Path('artifacts/v3_release_report.json').read_text())
          corpus=json.loads(Path('replay_db/summary.json').read_text())
          zip_path=Path(f'kaggriculture_adaptive_v{version}_submission.zip')
          with zipfile.ZipFile(zip_path) as z:
              assert z.namelist()==['main.py'], z.namelist()
          notes=f'''# Kaggriculture Adaptive Agent v{version}\n\n## Release type\nReplay-trained economic / farm-health candidate.\n\n## Replay evidence\n- Unique episodes: {corpus['unique_episodes']}\n- Trajectories: {corpus['trajectory_rows']}\n- Fit trajectories: {corpus['fit_rows']}\n- Outer holdout trajectories reserved: {corpus['outer_rows']}\n- Learned primary crop: {policy['primary_crop']}\n- Learned primary animal: {policy['primary_animal']}\n- Weed soft guard: {policy['weed_soft_ratio']:.3f}\n- Weed hard guard: {policy['weed_hard_ratio']:.3f}\n\n## Core changes\n- Replaced fixed replay-route imitation with replay-mined state targets.\n- Added hard farm-health governor: growth freezes when weeds/backlog are unsafe.\n- Weed DIG priority rises automatically at soft/hard thresholds.\n- Crop, animal, worker, cash and backlog targets vary by learned game phase.\n- Tiny-sample crop strategies are Bayesian-shrunk rather than overfit.\n- End-game liquidation retained.\n\n## Internal benchmark\n- Games: {bench['games']}\n- W/L/T: {bench['wins']}/{bench['losses']}/{bench['ties']}\n- Win rate: {bench['winrate']:.1%}\n- Mean delta: {bench['mean_delta']:.2f}\n- Invalid/error/timeout: {bench['invalid']}\n- Promotion recommended: {bench['promotion_recommended']}\n\n## Submission\nUpload `kaggriculture_adaptive_v{version}_submission.zip` directly to Kaggle. It contains only root-level `main.py`.\n'''
          Path(f'RELEASE_NOTES_v{version}.md').write_text(notes)
          manifest={'version':version,'submission':zip_path.name,'submission_sha256':hashlib.sha256(zip_path.read_bytes()).hexdigest(),'main_sha256':hashlib.sha256(Path('dist/main.py').read_bytes()).hexdigest(),'promotion_recommended':bench['promotion_recommended']}
          Path(f'release_manifest_v{version}.json').write_text(json.dumps(manifest,indent=2))
          print(notes)
          print(json.dumps(manifest,indent=2))
          PY
      - name: Upload v3 beta candidate
        uses: actions/upload-artifact@v4
        with:
          name: kaggriculture-adaptive-v3.0.0-beta.1
          path: |
            kaggriculture_adaptive_v3.0.0-beta.1_submission.zip
            RELEASE_NOTES_v3.0.0-beta.1.md
            release_manifest_v3.0.0-beta.1.json
            artifacts/economic_policy.json
            artifacts/v3_population_results.csv
            artifacts/v3_release_report.json
            replay_db/summary.json
          retention-days: 14
