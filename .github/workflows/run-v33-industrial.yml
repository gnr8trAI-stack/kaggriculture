name: run-v33-industrial-150k-gate-r1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/run-v33-industrial.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v33-industrial
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -q kaggle-environments
      - name: Compile independent V33
        run: python -m py_compile agents/v33_industrial.py
      - name: Run clean 24-game both-seat industrial gate
        run: |
          python - <<'PY'
          import json, statistics, subprocess
          from kaggle_environments import make
          import agents.v33_industrial as a

          results=[]
          for seed in range(333000,333012):
              for seat in (0,1):
                  a.reset_state()
                  env=make('kaggriculture',configuration={'seed':seed},debug=True)
                  env.run([a.agent,'starter'] if seat==0 else ['starter',a.agent])
                  st=env.state[seat]
                  tel=a.get_telemetry()
                  last=tel[-1] if tel else {}
                  qs=[last.get(f'q{i}',{}) for i in range(1,5)]
                  def snap(day):
                      rows=[r for r in tel if int(r.get('day',-1))<=day]
                      r=rows[-1] if rows else {}
                      return {'money':float(r.get('money',0) or 0),'productive':int(r.get('productive',0) or 0),'lands':int(r.get('lands',0) or 0),'hands':int(r.get('hands',0) or 0),'animals':int(r.get('animals',0) or 0)}
                  results.append({
                    'seed':seed,'seat':seat,'status':str(st.status),'reward':float(st.reward or 0),
                    'lands':int(last.get('lands',0) or 0),'hands':int(last.get('hands',0) or 0),
                    'animals':int(last.get('animals',0) or 0),'productive':int(last.get('productive',0) or 0),
                    'idle':int(last.get('idle',0) or 0),'utilization':float(last.get('utilization',0) or 0),
                    'q_productive':[int(q.get('productive',0) or 0) for q in qs],
                    'q_animals':[int(q.get('animals',0) or 0) for q in qs],
                    'q_plants':[int(q.get('plants',0) or 0) for q in qs],
                    'unlock_steps':last.get('land_unlock_steps',{}),
                    'capex':last.get('cumulative_capex',{}),'revenue_proxy':float(last.get('cumulative_revenue_proxy',0) or 0),
                    'reinvestment_ratio':float(last.get('reinvestment_ratio',0) or 0),
                    'd12':snap(12),'d20':snap(20),'d25':snap(25),
                    'action_counts':last.get('action_counts',{}),'last_allocator':last.get('allocator',{})
                  })
          rewards=[r['reward'] for r in results]
          invalid=sum(r['status'] in ('ERROR','INVALID','TIMEOUT') for r in results)
          med=lambda xs: statistics.median(xs) if xs else 0
          report={
            'version':'33.3.0-independent-industrial','source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'games':len(results),'invalid':invalid,
            'mean_reward':statistics.mean(rewards),'median_reward':med(rewards),'min_reward':min(rewards),'p10_reward':sorted(rewards)[max(0,int(len(rewards)*.1)-1)],'max_reward':max(rewards),
            'four_land_games':sum(r['lands']>=4 for r in results),'q3_active_games':sum(r['q_productive'][2]>=4 for r in results),'q4_active_games':sum(r['q_productive'][3]>=6 for r in results),
            'median_hands':med([r['hands'] for r in results]),'median_animals':med([r['animals'] for r in results]),'median_productive':med([r['productive'] for r in results]),'median_utilization':med([r['utilization'] for r in results]),
            'median_d12_money':med([r['d12']['money'] for r in results]),'median_d20_money':med([r['d20']['money'] for r in results]),'median_d25_money':med([r['d25']['money'] for r in results]),
            'median_d12_productive':med([r['d12']['productive'] for r in results]),'median_d20_productive':med([r['d20']['productive'] for r in results]),'median_d25_productive':med([r['d25']['productive'] for r in results]),
            'stage_a_pass':invalid==0 and sum(r['lands']>=4 for r in results)>=18 and sum(r['q_productive'][2]>=4 for r in results)>=18 and sum(r['q_productive'][3]>=6 for r in results)>=18,
            'ready_150k':invalid==0 and len(results)>=24 and med(rewards)>=150000 and min(rewards)>=100000,
            'games_detail':results
          }
          import os
          os.makedirs('benchmarks',exist_ok=True)
          open('benchmarks/v33_latest.json','w').write(json.dumps(report,indent=2))
          print(json.dumps({k:v for k,v in report.items() if k!='games_detail'},indent=2))
          PY
      - name: Persist benchmark report on V33 branch
        if: always()
        run: |
          if [ -f benchmarks/v33_latest.json ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add benchmarks/v33_latest.json
            git commit -m 'Record V33 industrial gate benchmark' || true
            git push origin HEAD:agent/v33-industrial
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v33-industrial-150k-gate
          path: benchmarks/v33_latest.json
          if-no-files-found: ignore
          retention-days: 14
