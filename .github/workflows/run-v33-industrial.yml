name: run-v33-7-industrial
on:
  push:
    branches: [main]
    paths: ['.github/workflows/run-v33-industrial.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v33-industrial
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -q kaggle-environments
      - name: Compile
        run: python -m py_compile agents/v33_industrial_v7.py agents/v19_2_early_scale8.py
      - name: Run 24-game both-seat isolated benchmark
        run: |
          python - <<'PY'
          import json, statistics, subprocess, sys
          from pathlib import Path

          CHILD=r'''
          import importlib,json,sys
          from kaggle_environments import make
          modname,seed,seat=sys.argv[1],int(sys.argv[2]),int(sys.argv[3])
          a=importlib.import_module(modname)
          if hasattr(a,'reset_state'): a.reset_state()
          env=make('kaggriculture',configuration={'seed':seed},debug=False)
          env.run([a.agent,'starter'] if seat==0 else ['starter',a.agent])
          st=env.state[seat]
          tel=a.get_telemetry() if hasattr(a,'get_telemetry') else []
          peaks={'lands':0,'hands':0,'animals':0,'productive':0,'q3_prod':0,'q4_prod':0}
          d12=d20=d25={}
          unlock={}
          for r in tel:
              if not isinstance(r,dict): continue
              peaks['lands']=max(peaks['lands'],int(r.get('lands',0) or 0))
              peaks['hands']=max(peaks['hands'],int(r.get('hands',0) or 0))
              peaks['animals']=max(peaks['animals'],int(r.get('animals',0) or 0))
              peaks['productive']=max(peaks['productive'],int(r.get('productive',0) or 0))
              q3=r.get('q3',{}) if isinstance(r.get('q3',{}),dict) else {}
              q4=r.get('q4',{}) if isinstance(r.get('q4',{}),dict) else {}
              peaks['q3_prod']=max(peaks['q3_prod'],int(q3.get('productive',0) or 0))
              peaks['q4_prod']=max(peaks['q4_prod'],int(q4.get('productive',0) or 0))
              unlock.update({str(k):v for k,v in (r.get('land_unlock_steps',{}) or {}).items()})
              day=int(r.get('day',-1) or -1)
              snap={'money':float(r.get('money',0) or 0),'productive':int(r.get('productive',0) or 0),'lands':int(r.get('lands',0) or 0),'hands':int(r.get('hands',0) or 0),'animals':int(r.get('animals',0) or 0)}
              if day==12: d12=snap
              if day==20: d20=snap
              if day==25: d25=snap
          last=tel[-1] if tel else {}
          out={'status':str(st.status),'reward':float(st.reward or 0),'peaks':peaks,'unlock':unlock,'d12':d12,'d20':d20,'d25':d25,
               'capex':last.get('cumulative_capex',{}) if isinstance(last,dict) else {},
               'revenue_proxy':float(last.get('cumulative_revenue_proxy',0) or 0) if isinstance(last,dict) else 0,
               'reinvestment_ratio':float(last.get('reinvestment_ratio',0) or 0) if isinstance(last,dict) else 0}
          print('RESULTJSON='+json.dumps(out,separators=(',',':')))
          '''
          def one(mod,seed,seat):
              p=subprocess.run([sys.executable,'-c',CHILD,mod,str(seed),str(seat)],text=True,capture_output=True,timeout=160)
              line=next((x for x in reversed(p.stdout.splitlines()) if x.startswith('RESULTJSON=')),None)
              if p.returncode or not line:
                  return {'status':'ERROR','reward':0.0,'peaks':{'lands':0,'hands':0,'animals':0,'productive':0,'q3_prod':0,'q4_prod':0},'stderr':p.stderr[-1600:]}
              return json.loads(line.split('=',1)[1])
          seeds=list(range(337000,337012)); rows=[]
          for seed in seeds:
              for seat in (0,1):
                  cand=one('agents.v33_industrial_v7',seed,seat)
                  ctrl=one('agents.v19_2_early_scale8',seed,seat)
                  rows.append({'seed':seed,'seat':seat,'candidate':cand,'control':ctrl,'delta':cand['reward']-ctrl['reward']})
                  print(seed,seat,cand['reward'],cand['peaks'])
          def summ(which):
              rs=[r[which] for r in rows]; rewards=[r['reward'] for r in rs]; s=sorted(rewards)
              invalid=sum(str(r.get('status')) in ('ERROR','INVALID','TIMEOUT') for r in rs)
              return {'games':len(rs),'invalid':invalid,'mean':statistics.mean(rewards),'median':statistics.median(rewards),'min':min(rewards),'p10':s[max(0,int(len(s)*.1)-1)],'p90':s[min(len(s)-1,int(len(s)*.9))],'max':max(rewards),
                      'median_peak_animals':statistics.median(r['peaks']['animals'] for r in rs),'max_peak_animals':max(r['peaks']['animals'] for r in rs),
                      'median_peak_lands':statistics.median(r['peaks']['lands'] for r in rs),'four_land_games':sum(r['peaks']['lands']>=4 for r in rs),
                      'q3_active_games':sum(r['peaks']['q3_prod']>0 for r in rs),'q4_active_games':sum(r['peaks']['q4_prod']>0 for r in rs),
                      'median_peak_hands':statistics.median(r['peaks']['hands'] for r in rs),'median_peak_productive':statistics.median(r['peaks']['productive'] for r in rs),
                      'median_d12_money':statistics.median((r.get('d12') or {}).get('money',0) for r in rs),'median_d20_money':statistics.median((r.get('d20') or {}).get('money',0) for r in rs),'median_d25_money':statistics.median((r.get('d25') or {}).get('money',0) for r in rs)}
          c=summ('candidate'); b=summ('control'); deltas=[r['delta'] for r in rows]
          report={'version':'33.7.0-frontier-shaped','source_commit':'aa97dab8ce10cce0553f68da88adc7fc91d4ae9e','candidate':c,'control_v19_2':b,
                  'paired':{'wins':sum(d>0 for d in deltas),'losses':sum(d<0 for d in deltas),'ties':sum(d==0 for d in deltas),'mean_delta':statistics.mean(deltas),'median_delta':statistics.median(deltas)},
                  'stage_a_pass':c['invalid']==0 and c['q3_active_games']>=20 and c['q4_active_games']>=12 and c['median_peak_lands']>=3,
                  'ready_150k':c['invalid']==0 and c['games']>=24 and c['median']>=150000 and c['min']>=100000,'games_detail':rows}
          Path('/tmp/v337.json').write_text(json.dumps(report,indent=2))
          print(json.dumps({k:v for k,v in report.items() if k!='games_detail'},indent=2))
          PY
      - name: Record benchmark
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '## V33.7 industrial benchmark'; echo '```json'; cat /tmp/v337.json 2>/dev/null || echo '{"error":"no report"}'; echo '```'; } >/tmp/comment.md
          gh issue comment 16 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v33-7-industrial
          path: /tmp/v337.json
          if-no-files-found: ignore
          retention-days: 14
