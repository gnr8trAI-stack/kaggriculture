name: run-v33-industrial-v33.2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/run-v33-industrial.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v33-industrial
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -q kaggle-environments
      - name: Compile
        run: python -m py_compile agents/v33_industrial_v2.py
      - name: Run 32-game industrial benchmark
        run: |
          python - <<'PY'
          import json, statistics
          from kaggle_environments import make
          import agents.v33_industrial_v2 as a
          results=[]
          for seed in range(332100,332116):
              for seat in (0,1):
                  a.reset_state(); env=make('kaggriculture',configuration={'seed':seed},debug=True)
                  env.run([a.agent,'starter'] if seat==0 else ['starter',a.agent])
                  st=env.state[seat]; tel=a.get_telemetry(); last=tel[-1] if tel else {}
                  qs=[last.get(f'q{i}',{}) for i in range(1,5)]
                  unlocked=[int(q.get('unlocked',0) or 0) for q in qs]; productive=[int(q.get('productive',0) or 0) for q in qs]
                  total_u=sum(unlocked); total_p=sum(productive)
                  results.append({'seed':seed,'seat':seat,'status':str(st.status),'reward':float(st.reward or 0),
                    'lands':int(last.get('lands',0) or 0),'hands':int(last.get('hands',0) or 0),
                    'productive':total_p,'utilization':float(last.get('utilization',total_p/max(1,total_u)) or 0),
                    'q_productive':productive,'q_unlocked':unlocked,'q3_animals':int(qs[2].get('animals',0) or 0),
                    'money':float(last.get('money',0) or 0),'reinvestment_ratio':float(last.get('reinvestment_ratio',0) or 0),
                    'capex':last.get('cumulative_capex',{}),'unlock_steps':last.get('land_unlock_steps',{})})
          rewards=[r['reward'] for r in results]; invalid=sum(r['status'] in ('ERROR','INVALID','TIMEOUT') for r in results)
          report={'version':'33.2.0-industrial','games':len(results),'invalid':invalid,
            'mean_reward':statistics.mean(rewards),'median_reward':statistics.median(rewards),'min_reward':min(rewards),'p10_reward':sorted(rewards)[max(0,int(len(rewards)*.1)-1)],'max_reward':max(rewards),
            'two_land_games':sum(r['lands']>=2 for r in results),'three_land_games':sum(r['lands']>=3 for r in results),'four_land_games':sum(r['lands']>=4 for r in results),
            'q3_active_games':sum(r['q_productive'][2]>=4 for r in results),'q4_active_games':sum(r['q_productive'][3]>=6 for r in results),
            'median_utilization':statistics.median(r['utilization'] for r in results),'median_hands':statistics.median(r['hands'] for r in results),
            'median_q3_animals':statistics.median(r['q3_animals'] for r in results),'median_reinvestment_ratio':statistics.median(r['reinvestment_ratio'] for r in results),
            'industrial_gate': invalid==0 and sum(r['lands']>=4 for r in results)>=24 and sum(r['q_productive'][2]>=4 for r in results)>=24 and sum(r['q_productive'][3]>=6 for r in results)>=24,
            'ready_150k': invalid==0 and statistics.median(rewards)>=150000 and min(rewards)>=100000,'games_detail':results}
          open('/tmp/v33_report.json','w').write(json.dumps(report,indent=2)); print(json.dumps({k:v for k,v in report.items() if k!='games_detail'},indent=2))
          PY
      - name: Post result to issue 16
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '## V33.2 Industrial benchmark'; echo; echo '```json'; cat /tmp/v33_report.json 2>/dev/null || echo '{"error":"no report"}'; echo '```'; } > /tmp/v33.md
          gh issue comment 16 --repo "$GITHUB_REPOSITORY" --body-file /tmp/v33.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v33-2-industrial-benchmark
          path: /tmp/v33_report.json
          if-no-files-found: ignore
          retention-days: 14
