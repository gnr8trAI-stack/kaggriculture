name: run-v33-9-industrial
on:
  push:
    branches: [main]
    paths: ['.github/workflows/run-v33-industrial.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v33-industrial
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -q kaggle-environments
      - name: Compile
        run: python -m py_compile agents/v33_industrial.py agents/v33_industrial_v9.py
      - name: Run isolated both-seat benchmark
        run: |
          python - <<'PY'
          import json, statistics, subprocess, sys, traceback
          from pathlib import Path
          OUT=Path('/tmp/v339.json')
          CHILD=r'''
          import importlib,json,sys
          from kaggle_environments import make
          modname,seed,seat=sys.argv[1],int(sys.argv[2]),int(sys.argv[3])
          a=importlib.import_module(modname)
          if hasattr(a,'reset_state'): a.reset_state()
          env=make('kaggriculture',configuration={'seed':seed},debug=False)
          env.run([a.agent,'starter'] if seat==0 else ['starter',a.agent])
          st=env.state[seat]
          tel=a.get_telemetry() if hasattr(a,'get_telemetry') else []
          peaks={'lands':0,'hands':0,'animals':0,'productive':0,'idle':0,'q3_prod':0,'q4_prod':0,'q3_animals':0}
          snaps={12:{},20:{},25:{}}; unlock={}; market_counts={}; capex={}; revenue=0.0; reinvest=0.0
          for r in tel:
              if not isinstance(r,dict): continue
              for k in ('lands','hands','animals','productive','idle'): peaks[k]=max(peaks[k],int(r.get(k,0) or 0))
              q3=r.get('q3',{}) if isinstance(r.get('q3',{}),dict) else {}; q4=r.get('q4',{}) if isinstance(r.get('q4',{}),dict) else {}
              peaks['q3_prod']=max(peaks['q3_prod'],int(q3.get('productive',0) or 0)); peaks['q4_prod']=max(peaks['q4_prod'],int(q4.get('productive',0) or 0)); peaks['q3_animals']=max(peaks['q3_animals'],int(q3.get('animals',0) or 0))
              unlock.update({str(k):v for k,v in (r.get('land_unlock_steps',{}) or {}).items()})
              for o in (r.get('market_actions',[]) or []):
                  if isinstance(o,list) and o: market_counts[str(o[0])]=market_counts.get(str(o[0]),0)+1
              d=int(r.get('day',-1) or -1)
              if d in snaps: snaps[d]={'money':float(r.get('money',0) or 0),'productive':int(r.get('productive',0) or 0),'lands':int(r.get('lands',0) or 0),'hands':int(r.get('hands',0) or 0),'animals':int(r.get('animals',0) or 0),'idle':int(r.get('idle',0) or 0)}
              capex=r.get('cumulative_capex',capex); revenue=float(r.get('cumulative_revenue_proxy',revenue) or revenue); reinvest=float(r.get('reinvestment_ratio',reinvest) or reinvest)
          print('RESULTJSON='+json.dumps({'status':str(st.status),'reward':float(st.reward or 0),'peaks':peaks,'unlock':unlock,'d12':snaps[12],'d20':snaps[20],'d25':snaps[25],'market_counts':market_counts,'capex':capex,'revenue_proxy':revenue,'reinvestment_ratio':reinvest},separators=(',',':')))
          '''
          def one(mod,seed,seat):
              try:
                  p=subprocess.run([sys.executable,'-c',CHILD,mod,str(seed),str(seat)],text=True,capture_output=True,timeout=150)
              except subprocess.TimeoutExpired:
                  return {'status':'TIMEOUT','reward':0.0,'peaks':{'lands':0,'hands':0,'animals':0,'productive':0,'idle':0,'q3_prod':0,'q4_prod':0,'q3_animals':0}}
              line=next((x for x in reversed(p.stdout.splitlines()) if x.startswith('RESULTJSON=')),None)
              if p.returncode or not line:
                  return {'status':'ERROR','reward':0.0,'peaks':{'lands':0,'hands':0,'animals':0,'productive':0,'idle':0,'q3_prod':0,'q4_prod':0,'q3_animals':0},'stderr':(p.stderr+p.stdout)[-2000:]}
              return json.loads(line.split('=',1)[1])
          try:
              seeds=list(range(339000,339012)); rows=[]
              for seed in seeds:
                  for seat in (0,1):
                      r=one('agents.v33_industrial_v9',seed,seat); rows.append({'seed':seed,'seat':seat,'candidate':r}); print('cand',seed,seat,r['status'],r['reward'],r['peaks'])
              rs=[x['candidate'] for x in rows]; rewards=[r['reward'] for r in rs]; s=sorted(rewards)
              invalid=sum(str(r.get('status')) in ('ERROR','INVALID','TIMEOUT') for r in rs)
              def med(field,day=None):
                  vals=[]
                  for r in rs:
                      src=r.get('peaks',{}) if day is None else (r.get('d'+str(day)) or {})
                      vals.append(float(src.get(field,0) or 0))
                  return statistics.median(vals)
              c={'games':len(rs),'invalid':invalid,'mean':statistics.mean(rewards),'median':statistics.median(rewards),'min':min(rewards),'p10':s[2],'p25':s[5],'p90':s[-3],'max':max(rewards),'median_peak_lands':med('lands'),'four_land_games':sum(r['peaks']['lands']>=4 for r in rs),'q3_active_games':sum(r['peaks']['q3_prod']>0 for r in rs),'q4_active_games':sum(r['peaks']['q4_prod']>0 for r in rs),'median_peak_animals':med('animals'),'median_q3_animals':med('q3_animals'),'median_peak_hands':med('hands'),'median_peak_productive':med('productive'),'median_d12_money':med('money',12),'median_d20_money':med('money',20),'median_d25_money':med('money',25),'median_d20_productive':med('productive',20),'median_d20_animals':med('animals',20)}
              controls=[]
              for seed in seeds[:3]:
                  for seat in (0,1): controls.append(one('agents.v19_2_early_scale8',seed,seat))
              cr=[x['reward'] for x in controls] if controls else []
              report={'version':'33.9.0-cash-disciplined','source_commit':'f9f62ec101a0ca6624ed63e163098a0d847bbc80','candidate':c,'control_v19_2_sample':{'games':len(cr),'median':statistics.median(cr) if cr else None,'min':min(cr) if cr else None,'max':max(cr) if cr else None},'stage_a_pass':invalid==0 and c['q3_active_games']>=20 and c['q4_active_games']>=12 and c['median_peak_lands']>=3,'ready_150k':invalid==0 and len(rs)>=24 and c['median']>=150000 and c['min']>=100000,'games_detail':rows}
              OUT.write_text(json.dumps(report,indent=2)); print(json.dumps({k:v for k,v in report.items() if k!='games_detail'},indent=2))
          except Exception as e:
              OUT.write_text(json.dumps({'version':'33.9.0-cash-disciplined','fatal_error':repr(e),'traceback':traceback.format_exc()},indent=2)); traceback.print_exc()
          PY
      - name: Record internal benchmark result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '## V33.9 industrial benchmark'; echo '```json'; cat /tmp/v339.json 2>/dev/null || echo '{"error":"no report"}'; echo '```'; } >/tmp/comment.md
          gh issue comment 16 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v33-9-industrial
          path: /tmp/v339.json
          if-no-files-found: ignore
          retention-days: 14
