name: score-frontier

on:
  push:
    branches:
      - agent/adaptive-replay-lab-final
    paths:
      - 'trainer/analyze_score_frontier.py'
      - 'trainer/harvest_kaggle_replays.py'
      - 'trainer/ingest_replays.py'
      - '.github/workflows/score-frontier.yml'
  pull_request:
    paths:
      - 'trainer/analyze_score_frontier.py'
      - 'trainer/harvest_kaggle_replays.py'
      - 'trainer/ingest_replays.py'
      - '.github/workflows/score-frontier.yml'
  workflow_dispatch:

jobs:
  analyze-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          sudo apt-get clean || true
          df -h /

      - name: Install Kaggle tooling
        run: |
          python -m pip install --upgrade pip
          pip install kaggle kaggle-environments

      - name: Verify frontier tooling
        run: |
          test -n "$KAGGLE_API_TOKEN"
          python -m py_compile trainer/harvest_kaggle_replays.py trainer/ingest_replays.py trainer/analyze_score_frontier.py

      - name: Harvest public Kaggriculture replays
        run: |
          python trainer/harvest_kaggle_replays.py --output raw_kaggle_replays

      - name: Build replay index
        run: |
          python trainer/ingest_replays.py --input raw_kaggle_replays --output replay_db

      - name: Analyze real score frontier
        run: |
          python trainer/analyze_score_frontier.py --corpus replay_db --output artifacts/frontier --top-n 50
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('artifacts/frontier/frontier_summary.json').read_text())
          print(json.dumps(s,indent=2))
          print('>=100k:',s['threshold_counts']['100000'])
          print('>=150k:',s['threshold_counts']['150000'])
          print('>=200k:',s['threshold_counts']['200000'])
          PY

      - name: Upload score-frontier evidence
        uses: actions/upload-artifact@v4
        with:
          name: kaggriculture-score-frontier
          path: |
            artifacts/frontier/frontier_summary.json
            artifacts/frontier/frontier_top_trajectories.csv
            artifacts/frontier/frontier_daily_curves.csv
            artifacts/frontier/frontier_action_mix.csv
            replay_db/summary.json
            raw_kaggle_replays/harvest_summary.json
          retention-days: 30
