name: run-v34-26-terminal-liquidation
on:
  push:
    branches: [agent/v34-26-terminal-liquidation]
    paths:
      - 'agents/v34_26_terminal_liquidation.py'
      - '.github/workflows/run-v34-26-terminal-liquidation.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with: {ref: agent/v34-26-terminal-liquidation, path: candidate}
      - uses: actions/checkout@v6
        with: {ref: agent/v32.4-surplus-land, path: control}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: pip install -q kaggle-environments
      - name: Compile
        run: |
          python -m py_compile candidate/agents/v34_26_terminal_liquidation.py candidate/agents/v34_23_earlier_strawberry.py
          python -m py_compile control/agents/v19_2_early_scale8.py
      - name: Run isolated 24-game both-seat readiness gate
        run: |
          python - <<'PY'
          import json,statistics,subprocess,sys,os
          from pathlib import Path
          CHILD=r'''
          import importlib,json,sys,os
          from kaggle_environments import make
          root,mod,seed,seat=sys.argv[1],sys.argv[2],int(sys.argv[3]),int(sys.argv[4]);sys.path.insert(0,root);os.chdir(root)
          a=importlib.import_module(mod)
          if hasattr(a,'reset_state'):a.reset_state()
          env=make('kaggriculture',configuration={'seed':seed},debug=False)
          env.run([a.agent,'starter'] if seat==0 else ['starter',a.agent])
          st=env.state[seat];tel=a.get_telemetry() if hasattr(a,'get_telemetry') else []
          peaks={'active_cows':0,'pastures':0,'hands':0,'productive':0};cash={12:0,16:0,20:0,25:0,28:0,29:0}
          for r in tel:
            if not isinstance(r,dict):continue
            for k in peaks:peaks[k]=max(peaks[k],int(r.get(k,0) or 0))
            d=int(r.get('day',-1) or -1)
            if d in cash:cash[d]=float(r.get('money',0) or 0)
          print('RESULTJSON='+json.dumps({'status':str(st.status),'reward':float(st.reward or 0),'peaks':peaks,'cash':cash,'strawberry':bool(a.strawberry_triggered()) if hasattr(a,'strawberry_triggered') else False,'liquidated':bool(a.terminal_liquidation_triggered()) if hasattr(a,'terminal_liquidation_triggered') else False},separators=(',',':')))
          '''
          def one(root,mod,seed,seat):
            try:p=subprocess.run([sys.executable,'-c',CHILD,root,mod,str(seed),str(seat)],text=True,capture_output=True,timeout=150)
            except subprocess.TimeoutExpired:return {'status':'TIMEOUT','reward':0.0,'peaks':{},'cash':{}}
            line=next((x for x in reversed(p.stdout.splitlines()) if x.startswith('RESULTJSON=')),None)
            if p.returncode or not line:return {'status':'ERROR','reward':0.0,'peaks':{},'cash':{},'stderr':(p.stderr+p.stdout)[-2000:]}
            return json.loads(line.split('=',1)[1])
          rows=[]
          for seed in range(342600,342612):
            for seat in (0,1):
              c=one('candidate','agents.v34_26_terminal_liquidation',seed,seat)
              p=one('candidate','agents.v34_23_earlier_strawberry',seed,seat)
              b=one('control','agents.v19_2_early_scale8',seed,seat)
              rows.append({'seed':seed,'seat':seat,'candidate':c,'parent_v34_23':p,'control_v19_2':b,'delta_parent':c['reward']-p['reward'],'delta_control':c['reward']-b['reward']})
          def summ(key):
            rs=[x[key] for x in rows];rw=[float(r.get('reward',0) or 0) for r in rs];s=sorted(rw)
            out={'games':len(rs),'invalid':sum(str(r.get('status')) in ('ERROR','INVALID','TIMEOUT') for r in rs),'mean':statistics.mean(rw),'median':statistics.median(rw),'min':min(rw),'p10':s[2],'p25':s[5],'p75':s[-6],'p90':s[-3],'max':max(rw)}
            if key=='candidate':
              out['liquidation_games']=sum(bool(r.get('liquidated')) for r in rs)
              out['strawberry_games']=sum(bool(r.get('strawberry')) for r in rs)
              for k in ('active_cows','pastures','hands','productive'):out['median_peak_'+k]=statistics.median(float((r.get('peaks') or {}).get(k,0) or 0) for r in rs)
              for d in (12,16,20,25,28,29):out['median_d'+str(d)+'_money']=statistics.median(float((r.get('cash') or {}).get(str(d),(r.get('cash') or {}).get(d,0)) or 0) for r in rs)
            return out
          c=summ('candidate');p=summ('parent_v34_23');b=summ('control_v19_2');dp=[x['delta_parent'] for x in rows];db=[x['delta_control'] for x in rows]
          report={'version':'34.26.0-terminal-liquidation','mechanism':'V34.23 unchanged except day28+ sells all shed outputs and day29+ also liquidates remaining wheat','candidate':c,'parent_v34_23':p,'control_v19_2':b,'paired_parent':{'wins':sum(x>0 for x in dp),'losses':sum(x<0 for x in dp),'ties':sum(x==0 for x in dp),'median_delta':statistics.median(dp)},'paired_control':{'wins':sum(x>0 for x in db),'losses':sum(x<0 for x in db),'ties':sum(x==0 for x in db),'median_delta':statistics.median(db)},'ready_150k':c['invalid']==0 and c['games']>=24 and c['median']>=150000 and c['min']>=100000,'games_detail':rows}
          out=Path('candidate/benchmarks/v34_v26_latest.json');out.parent.mkdir(parents=True,exist_ok=True);out.write_text(json.dumps(report,indent=2));print(json.dumps({k:v for k,v in report.items() if k!='games_detail'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: v34-26-terminal-liquidation, path: candidate/benchmarks/v34_v26_latest.json, if-no-files-found: ignore, retention-days: 14}
      - name: Persist benchmark report
        if: always()
        working-directory: candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmarks/v34_v26_latest.json || true
          if ! git diff --cached --quiet; then
            git commit -m 'bench: record V34.26 isolated 24-game distribution'
            git push origin HEAD:agent/v34-26-terminal-liquidation
          fi
