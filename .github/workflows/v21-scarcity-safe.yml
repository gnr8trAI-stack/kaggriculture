name: v21-scarcity-safe

on:
  push:
    branches:
      - agent/adaptive-replay-lab-final
    paths:
      - 'agents/v19_livestock_compound.py'
      - 'agents/v21_scarcity_safe.py'
      - '.github/workflows/v21-scarcity-safe.yml'
  pull_request:
    paths:
      - 'agents/v19_livestock_compound.py'
      - 'agents/v21_scarcity_safe.py'
      - '.github/workflows/v21-scarcity-safe.yml'
  workflow_dispatch:

jobs:
  scarcity-safe-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install simulator
        run: |
          python -m pip install --upgrade pip
          pip install kaggle-environments
      - name: Compile
        run: |
          python -m py_compile agents/v15_champion.py agents/v19_livestock_compound.py agents/v21_scarcity_safe.py
      - name: Run isolated scarcity tournament
        run: |
          mkdir -p artifacts dist
          python - <<'PY'
          import csv, importlib.util, json, math, statistics
          from pathlib import Path
          from kaggle_environments import make

          BAD={'ERROR','INVALID','TIMEOUT'}
          def load(path,name):
              spec=importlib.util.spec_from_file_location(name,path)
              mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod); return mod
          v21=load('agents/v21_scarcity_safe.py','v21')
          v19=load('agents/v19_livestock_compound.py','v19')

          def play(mod,ref,seat,seed,series):
              if callable(getattr(mod,'reset_state',None)): mod.reset_state()
              agents=[mod.agent,ref] if seat==0 else [ref,mod.agent]
              env=make('kaggriculture',configuration={'seed':seed},debug=True)
              env.run(agents)
              mine=env.state[seat]; other=env.state[1-seat]
              cr=float(mine.reward or 0); rr=float(other.reward or 0)
              return {'series':series,'seat':seat,'seed':seed,'candidate_reward':cr,'reference_reward':rr,
                      'delta':cr-rr,'result':'win' if cr>rr else 'loss' if cr<rr else 'tie',
                      'candidate_status':str(mine.status),'reference_status':str(other.status)}

          rows=[]
          for seat in (0,1):
              for off in range(30):
                  r=play(v21,v19.agent,seat,930000+off,'v21_vs_v19'); rows.append(r); print(r)
          for label,mod in (('v21',v21),('v19',v19)):
              for seat in (0,1):
                  for off in range(30):
                      r=play(mod,'starter',seat,940000+off,f'{label}_vs_starter'); rows.append(r); print(r)

          with Path('artifacts/v21_scarcity_results.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0])); w.writeheader(); w.writerows(rows)

          def q(v,p):
              v=sorted(v); pos=(len(v)-1)*p; lo=math.floor(pos); hi=math.ceil(pos)
              return float(v[lo] if lo==hi else v[lo]+(v[hi]-v[lo])*(pos-lo))
          def summ(g):
              rewards=[r['candidate_reward'] for r in g]
              return {'games':len(g),'wins':sum(r['result']=='win' for r in g),'losses':sum(r['result']=='loss' for r in g),
                      'score_rate':sum(1 if r['result']=='win' else .5 if r['result']=='tie' else 0 for r in g)/len(g),
                      'mean_reward':statistics.fmean(rewards),'median_reward':statistics.median(rewards),
                      'p10_reward':q(rewards,.1),'p90_reward':q(rewards,.9),'max_reward':max(rewards),
                      'mean_delta':statistics.fmean(r['delta'] for r in g),
                      'seat0_delta':statistics.fmean(r['delta'] for r in g if r['seat']==0),
                      'seat1_delta':statistics.fmean(r['delta'] for r in g if r['seat']==1),
                      'invalid':sum(r['candidate_status'] in BAD for r in g)}

          d=summ([r for r in rows if r['series']=='v21_vs_v19'])
          s21=summ([r for r in rows if r['series']=='v21_vs_starter'])
          s19=summ([r for r in rows if r['series']=='v19_vs_starter'])
          mean_ratio=s21['mean_reward']/max(1.0,s19['mean_reward'])
          p10_ratio=s21['p10_reward']/max(1.0,s19['p10_reward'])
          promote=(d['invalid']==0 and s21['invalid']==0 and
                   d['score_rate']>=0.50 and d['mean_delta']>=0 and
                   d['seat0_delta']>=-250 and d['seat1_delta']>=-250 and
                   mean_ratio>=1.00 and p10_ratio>=0.98 and s21['mean_reward']>=45000)
          report={'version':'21.0.0-alpha2','mutation':'V19 + liquidity-safe premium sell throttle only',
                  'direct_v21_vs_v19':d,'v21_vs_starter':s21,'v19_vs_starter':s19,
                  'mean_reward_ratio':mean_ratio,'p10_ratio':p10_ratio,'promotion_recommended':promote}
          Path('artifacts/v21_scarcity_report.json').write_text(json.dumps(report,indent=2))
          Path('artifacts/PROMOTE').write_text('1' if promote else '0')
          print(json.dumps(report,indent=2))
          PY
      - name: Build standalone if passed
        run: |
          python - <<'PY'
          from pathlib import Path
          if Path('artifacts/PROMOTE').read_text().strip()!='1': raise SystemExit(0)
          import agents.v15_champion as base
          v19=Path('agents/v19_livestock_compound.py').read_text()
          replacement=('import base64, types, zlib\n_v15=types.ModuleType("_v15_embedded")\n'
                       f'_V15_PAYLOAD={base._PAYLOAD!r}\n'
                       'exec(zlib.decompress(base64.b64decode(_V15_PAYLOAD)).decode("utf-8"),_v15.__dict__,_v15.__dict__)')
          v19=v19.replace('from agents import v15_champion as _v15',replacement)
          overlay=Path('agents/v21_scarcity_safe.py').read_text()
          # Standalone: execute V19 in a module, then bind wrapper to it.
          overlay=overlay.replace('from __future__ import annotations\n','')
          overlay=overlay.replace('from agents import v19_livestock_compound as _v19','')
          prefix='import types\n_v19=types.ModuleType("_v19_embedded")\nexec('+repr(v19)+',_v19.__dict__,_v19.__dict__)\n'
          Path('dist/main.py').write_text(prefix+overlay)
          PY
          if [ -f dist/main.py ]; then python -m py_compile dist/main.py; ! grep -Eq '^from agents|^import agents' dist/main.py; fi
      - name: Package if passed
        run: |
          if [ "$(cat artifacts/PROMOTE)" != "1" ]; then exit 0; fi
          (cd dist && zip -9 ../kaggriculture_adaptive_v21.0.0-alpha2_submission.zip main.py)
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          z=Path('kaggriculture_adaptive_v21.0.0-alpha2_submission.zip')
          with zipfile.ZipFile(z) as f: assert f.namelist()==['main.py']
          r=json.loads(Path('artifacts/v21_scarcity_report.json').read_text())
          Path('RELEASE_NOTES_v21.0.0-alpha2.md').write_text('# V21 alpha2\n\nSingle isolated mutation: V19 plus liquidity-safe premium sell throttling.\n\n'+json.dumps(r,indent=2))
          Path('release_manifest_v21.0.0-alpha2.json').write_text(json.dumps({'version':'21.0.0-alpha2','submission_sha256':hashlib.sha256(z.read_bytes()).hexdigest(),'promotion_recommended':True},indent=2))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v21-scarcity-safe-gate
          path: |
            artifacts/v21_scarcity_results.csv
            artifacts/v21_scarcity_report.json
            artifacts/PROMOTE
            dist/main.py
            kaggriculture_adaptive_v21.0.0-alpha2_submission.zip
            RELEASE_NOTES_v21.0.0-alpha2.md
            release_manifest_v21.0.0-alpha2.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Enforce isolated gate
        if: always()
        run: |
          test -f artifacts/PROMOTE
          test "$(cat artifacts/PROMOTE)" = "1"
