name: benchmark-v3b

on:
  pull_request:
    branches: [main]
    paths:
      - 'agents/v3b_conservative.py'
      - 'scripts/benchmark_v3b.py'
      - 'tests/test_v3b_conservative.py'
      - '.github/workflows/benchmark-v3b.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Run V3b against frozen V2
        run: python -m scripts.benchmark_v3b --games-per-seat 10 --output experiments/v3b-conservative-vs-v2-20.json
      - name: Enforce runtime safety gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('experiments/v3b-conservative-vs-v2-20.json').read_text())
          summary = report['summary']
          assert summary['invalid_or_error_games'] == 0, summary
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3b-conservative-benchmark
          path: experiments/v3b-conservative-vs-v2-20.json
          if-no-files-found: warn
