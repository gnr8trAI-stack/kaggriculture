name: benchmark-v3

on:
  pull_request:
    branches: [main]
    paths:
      - 'agents/**'
      - 'scripts/benchmark*.py'
      - '.github/workflows/benchmark-v3.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Run V3 against frozen V2
        run: python scripts/benchmark_v3.py --games-per-seat 10 --output experiments/v3-season-aware-vs-v2-20.json
      - name: Enforce runtime safety gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('experiments/v3-season-aware-vs-v2-20.json').read_text())
          summary = report['summary']
          assert summary['invalid_or_error_games'] == 0, summary
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v3-season-aware-benchmark
          path: experiments/v3-season-aware-vs-v2-20.json
