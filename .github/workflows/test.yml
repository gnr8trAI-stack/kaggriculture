name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run unit tests
        run: python -m pytest -q
      - name: Build standalone submission
        run: python scripts/build_submission.py
      - name: Compile standalone submission
        run: python -m py_compile dist/submission.py
