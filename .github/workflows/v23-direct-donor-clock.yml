name: v23-direct-donor-clock

on:
  push:
    branches:
      - agent/adaptive-replay-lab-final
    paths:
      - 'agents/v23_direct_donor_clock.py'
      - '.github/workflows/v23-direct-donor-clock.yml'
  pull_request:
    paths:
      - 'agents/v23_direct_donor_clock.py'
      - '.github/workflows/v23-direct-donor-clock.yml'
  workflow_dispatch:

jobs:
  donor-clock-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install simulator
        run: |
          python -m pip install --upgrade pip
          pip install kaggle-environments
      - name: Compile
        run: |
          python -m py_compile agents/v23_direct_donor_clock.py agents/v19_livestock_compound.py
      - name: Run donor clock tournament
        run: |
          mkdir -p artifacts dist
          python - <<'PY'
          import csv, importlib.util, json, math, statistics
          from pathlib import Path
          from kaggle_environments import make

          BAD={'ERROR','INVALID','TIMEOUT'}
          def load(path,name):
              spec=importlib.util.spec_from_file_location(name,path)
              mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod); return mod
          v23=load('agents/v23_direct_donor_clock.py','v23')
          v19=load('agents/v19_livestock_compound.py','v19')

          def reset(mod):
              fn=getattr(mod,'reset_state',None)
              if callable(fn): fn()
          def tele(mod):
              fn=getattr(mod,'get_telemetry',None)
              if not callable(fn): return []
              try: return fn(clear=True) or []
              except TypeError: return fn() or []
          def play(mod,ref,seat,seed,series):
              reset(mod)
              env=make('kaggriculture',configuration={'seed':seed},debug=True)
              env.run([mod.agent,ref] if seat==0 else [ref,mod.agent])
              mine=env.state[seat]; other=env.state[1-seat]; t=tele(mod)
              r=float(mine.reward or 0); o=float(other.reward or 0)
              return {
                'series':series,'seat':seat,'seed':seed,'reward':r,'reference':o,'delta':r-o,
                'result':'win' if r>o else 'loss' if r<o else 'tie','status':str(mine.status),
                'max_land':max([int(x.get('land',0) or 0) for x in t] or [0]),
                'max_pastures':max([int(x.get('pastures',0) or 0) for x in t] or [0]),
                'max_cows':max([int(x.get('cows',0) or 0) for x in t] or [0]),
                'max_sheep':max([int(x.get('sheep',0) or 0) for x in t] or [0]),
                'max_strawberries':max([int(x.get('strawberries',0) or 0) for x in t] or [0]),
                'total_local_repairs':sum(int(x.get('local_repairs',0) or 0) for x in t),
                'total_market_repairs':sum(int(x.get('market_repairs',0) or 0) for x in t),
              }

          rows=[]
          # Absolute distribution is primary; independent town/population draws.
          for seat in (0,1):
              for off in range(40):
                  x=play(v23,'starter',seat,970000+off,'v23_vs_starter'); rows.append(x); print(x)
          for seat in (0,1):
              for off in range(20):
                  x=play(v19,'starter',seat,980000+off,'v19_vs_starter'); rows.append(x); print(x)
          for seat in (0,1):
              for off in range(20):
                  x=play(v23,v19.agent,seat,990000+off,'v23_vs_v19'); rows.append(x); print(x)

          with Path('artifacts/v23_direct_donor_results.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0])); w.writeheader(); w.writerows(rows)
          def q(vals,p):
              vals=sorted(vals); x=(len(vals)-1)*p; lo=math.floor(x); hi=math.ceil(x)
              return vals[lo] if lo==hi else vals[lo]+(vals[hi]-vals[lo])*(x-lo)
          def summ(g):
              rr=[x['reward'] for x in g]
              return {
                'games':len(g),'mean':statistics.fmean(rr),'median':statistics.median(rr),'p10':q(rr,.1),'p90':q(rr,.9),'max':max(rr),
                'ge100k':sum(x>=100000 for x in rr),'ge150k':sum(x>=150000 for x in rr),'ge175k':sum(x>=175000 for x in rr),'ge190k':sum(x>=190000 for x in rr),'ge200k':sum(x>=200000 for x in rr),
                'wins':sum(x['result']=='win' for x in g),'losses':sum(x['result']=='loss' for x in g),
                'score_rate':sum(1 if x['result']=='win' else .5 if x['result']=='tie' else 0 for x in g)/len(g),
                'mean_delta':statistics.fmean(x['delta'] for x in g),
                'seat0_delta':statistics.fmean(x['delta'] for x in g if x['seat']==0),
                'seat1_delta':statistics.fmean(x['delta'] for x in g if x['seat']==1),
                'invalid':sum(x['status'] in BAD for x in g),
                'median_repairs':statistics.median(x['total_local_repairs'] for x in g),
                'median_market_repairs':statistics.median(x['total_market_repairs'] for x in g),
                'games_3land':sum(x['max_land']>=3 for x in g),'games_14pastures':sum(x['max_pastures']>=14 for x in g),
                'games_8cow6sheep':sum(x['max_cows']>=8 and x['max_sheep']>=6 for x in g),
                'games_35strawberry':sum(x['max_strawberries']>=35 for x in g),
              }
          s=summ([x for x in rows if x['series']=='v23_vs_starter'])
          c=summ([x for x in rows if x['series']=='v19_vs_starter'])
          d=summ([x for x in rows if x['series']=='v23_vs_v19'])
          credible=(s['invalid']==0 and s['median']>=120000 and s['p90']>=150000 and s['max']>=175000 and s['games_14pastures']>=60 and s['games_8cow6sheep']>=60)
          frontier=(credible and s['median']>=155000 and s['p10']>=130000 and s['ge175k']>=8 and s['games_35strawberry']>=60)
          report={'version':'23.0.0-alpha1','method':'direct clock policy from 181274 donor replay with local legality repair','v23_vs_starter':s,'v19_control':c,'v23_vs_v19':d,'credible_download':credible,'frontier_reproduced':frontier}
          Path('artifacts/v23_direct_donor_report.json').write_text(json.dumps(report,indent=2))
          Path('artifacts/CREDIBLE').write_text('1' if credible else '0')
          print(json.dumps(report,indent=2))
          PY
      - name: Package only if economically credible
        run: |
          if [ "$(cat artifacts/CREDIBLE)" != "1" ]; then exit 0; fi
          cp agents/v23_direct_donor_clock.py dist/main.py
          python -m py_compile dist/main.py
          (cd dist && zip -9 ../kaggriculture_adaptive_v23.0.0-alpha1_submission.zip main.py)
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          z=Path('kaggriculture_adaptive_v23.0.0-alpha1_submission.zip')
          with zipfile.ZipFile(z) as f: assert f.namelist()==['main.py']
          report=json.loads(Path('artifacts/v23_direct_donor_report.json').read_text())
          Path('release_manifest_v23.0.0-alpha1.json').write_text(json.dumps({'version':'23.0.0-alpha1','submission_sha256':hashlib.sha256(z.read_bytes()).hexdigest(),'credible_download':True,'frontier_reproduced':report['frontier_reproduced']},indent=2))
          Path('RELEASE_NOTES_v23.0.0-alpha1.md').write_text('# V23 direct donor clock policy\n\n'+json.dumps(report,indent=2))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v23-direct-donor-clock-gate
          path: |
            artifacts/v23_direct_donor_results.csv
            artifacts/v23_direct_donor_report.json
            artifacts/CREDIBLE
            dist/main.py
            kaggriculture_adaptive_v23.0.0-alpha1_submission.zip
            RELEASE_NOTES_v23.0.0-alpha1.md
            release_manifest_v23.0.0-alpha1.json
          if-no-files-found: ignore
          retention-days: 30
