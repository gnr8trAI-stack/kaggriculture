name: run-v33-30-v19-terminal-liquidation
on:
  push:
    branches: [agent/v33.30-v19-terminal-liquidation]
    paths:
      - 'agents/v33_v19_terminal_liquidation.py'
      - '.github/workflows/run-v33-v19-terminal-liquidation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with: {ref: agent/v33.30-v19-terminal-liquidation, path: candidate}
      - uses: actions/checkout@v6
        with: {ref: agent/v32.4-surplus-land, path: baseline}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: pip install -q kaggle-environments
      - name: Compile
        run: |
          python -m py_compile candidate/agents/v33_v19_terminal_liquidation.py candidate/agents/v19_2_early_scale8.py
          python -m py_compile baseline/agents/v19_2_early_scale8.py
      - name: Run isolated 24-game both-seat benchmark
        run: |
          python - <<'PY'
          import json,statistics,subprocess,sys
          from pathlib import Path
          CHILD=r'''
          import importlib,json,sys,os
          from kaggle_environments import make
          root,mod,seed,seat=sys.argv[1],sys.argv[2],int(sys.argv[3]),int(sys.argv[4])
          sys.path.insert(0,root); os.chdir(root)
          a=importlib.import_module(mod)
          if hasattr(a,'reset_state'): a.reset_state()
          env=make('kaggriculture',configuration={'seed':seed},debug=False)
          env.run([a.agent,'starter'] if seat==0 else ['starter',a.agent])
          st=env.state[seat]
          print('RESULTJSON='+json.dumps({'status':str(st.status),'reward':float(st.reward or 0)},separators=(',',':')))
          '''
          def one(root,mod,seed,seat):
            try:
              p=subprocess.run([sys.executable,'-c',CHILD,root,mod,str(seed),str(seat)],text=True,capture_output=True,timeout=150)
            except subprocess.TimeoutExpired:
              return {'status':'TIMEOUT','reward':0.0}
            line=next((x for x in reversed(p.stdout.splitlines()) if x.startswith('RESULTJSON=')),None)
            if p.returncode or not line:
              return {'status':'ERROR','reward':0.0,'stderr':(p.stderr+p.stdout)[-2000:]}
            return json.loads(line.split('=',1)[1])
          rows=[]
          for seed in range(360200,360212):
            for seat in (0,1):
              c=one('candidate','agents.v33_v19_terminal_liquidation',seed,seat)
              b=one('baseline','agents.v19_2_early_scale8',seed,seat)
              rows.append({'seed':seed,'seat':seat,'candidate':c,'control':b,'delta':c['reward']-b['reward']})
          def summ(which):
            rs=[x[which] for x in rows]; rewards=[float(r.get('reward',0) or 0) for r in rs]; s=sorted(rewards)
            invalid=sum(str(r.get('status')) in ('ERROR','INVALID','TIMEOUT') for r in rs)
            return {'games':len(rs),'invalid':invalid,'mean':statistics.mean(rewards),'median':statistics.median(rewards),'min':min(rewards),'p10':s[2],'p25':s[5],'p90':s[-3],'max':max(rewards)}
          c=summ('candidate'); b=summ('control'); ds=[x['delta'] for x in rows]
          report={'version':'33.30.0-v19-terminal-liquidation','mechanism':'exact V19.2 plus D29 hour>=18 shed liquidation only','candidate':c,'control_v19_2':b,'paired':{'wins':sum(x>0 for x in ds),'losses':sum(x<0 for x in ds),'ties':sum(x==0 for x in ds),'mean_delta':statistics.mean(ds),'median_delta':statistics.median(ds)},'ready_150k':c['invalid']==0 and c['games']>=24 and c['median']>=150000 and c['min']>=100000,'games_detail':rows}
          Path('/tmp/v3330.json').write_text(json.dumps(report,indent=2))
          print(json.dumps({k:v for k,v in report.items() if k!='games_detail'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: v33-30-v19-terminal-liquidation, path: /tmp/v3330.json, if-no-files-found: ignore, retention-days: 14}
