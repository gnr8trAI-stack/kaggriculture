name: live-elite-submit-now
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -q kaggle
      - name: Build
        run: |
          mkdir -p dist
          cp agents/v23_direct_donor_clock.py dist/main.py
          python -m py_compile dist/main.py
          cd dist && zip -9 submission.zip main.py
      - name: Submit
        run: kaggle competitions submit kaggriculture -f dist/submission.zip -m "Elite industrial livestock replay reconstruction"
