name: run-v33-77-replay-timed-land
on:
  push:
    branches: [agent/v33-industrial]
    paths:
      - 'agents/v33_industrial_v77.py'
      - 'scripts/benchmark_v33_v77.py'
      - '.github/workflows/run-v33-industrial-v77.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with: {ref: agent/v33-industrial}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: pip install -q kaggle-environments
      - name: Compile
        run: python -m py_compile agents/v33_industrial_v77.py scripts/benchmark_v33_v77.py
      - name: Run isolated 24-game both-seat gate
        run: python scripts/benchmark_v33_v77.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v33-77-replay-timed-land
          path: benchmarks/v33_v77_latest.json
          if-no-files-found: ignore
          retention-days: 14
