name: submit-v32.4-live
on:
  push:
    branches: [main]
    paths: ['.github/workflows/submit-v32-4.yml']
permissions:
  contents: read
  issues: write
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v32.4-surplus-land
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -q kaggle kaggle-environments
      - name: Build single-file standalone V32.4
        run: |
          mkdir -p dist
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          mods = [
              ('agents.v15_champion','agents/v15_champion.py'),
              ('agents.v19_livestock_compound','agents/v19_livestock_compound.py'),
              ('agents.v19_2_early_scale8','agents/v19_2_early_scale8.py'),
              ('agents.v32_4_surplus_land','agents/v32_4_surplus_land.py'),
          ]
          payloads=[]
          for name,path in mods:
              src=Path(path).read_text(encoding='utf-8')
              payloads.append((name, base64.b64encode(zlib.compress(src.encode(),9)).decode()))
          out = [
              'import sys, types, base64, zlib',
              "agents = types.ModuleType('agents')",
              "agents.__path__ = []",
              "sys.modules['agents'] = agents",
              f'_PAYLOADS = {payloads!r}',
              'for _name, _blob in _PAYLOADS:',
              '    _mod = types.ModuleType(_name)',
              "    _mod.__package__ = 'agents'",
              '    sys.modules[_name] = _mod',
              "    setattr(agents, _name.rsplit('.',1)[1], _mod)",
              "    exec(compile(zlib.decompress(base64.b64decode(_blob)).decode('utf-8'), '<embedded:'+_name+'>', 'exec'), _mod.__dict__)",
              "agent = sys.modules['agents.v32_4_surplus_land'].agent",
          ]
          Path('dist/kaggriculture_v32.4_standalone.py').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          python -m py_compile dist/kaggriculture_v32.4_standalone.py
          wc -c dist/kaggriculture_v32.4_standalone.py
      - name: Test exact file through Kaggle Environments agent loader
        run: |
          rm -rf /tmp/v324clean && mkdir /tmp/v324clean
          cp dist/kaggriculture_v32.4_standalone.py /tmp/v324clean/submission.py
          cd /tmp/v324clean
          python - <<'PY'
          from kaggle_environments import make
          env=make('kaggriculture',configuration={'seed':329104},debug=True)
          env.run(['submission.py','starter'])
          st=env.state[0]
          print('FILE-LOADER status=',st.status,'reward=',st.reward)
          assert str(st.status) not in {'ERROR','INVALID','TIMEOUT'}
          PY
      - name: Capture pre-submit rows
        run: |
          kaggle competitions submissions -c kaggriculture -v > /tmp/before.txt 2>&1
          head -15 /tmp/before.txt
      - name: Submit standalone V32.4
        id: submit
        run: |
          set +e
          kaggle competitions submit -c kaggriculture \
            -f dist/kaggriculture_v32.4_standalone.py \
            -m 'V32.4 standalone surplus-land live test' > /tmp/submit.txt 2>&1
          rc=$?
          cat /tmp/submit.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Poll Kaggle until terminal status
        id: poll
        if: success()
        run: |
          set -e
          for i in $(seq 1 18); do
            kaggle competitions submissions -c kaggriculture -v > /tmp/after.txt 2>&1
            row=$(grep 'V32.4 standalone surplus-land live test' /tmp/after.txt | head -1 || true)
            echo "$row"
            if echo "$row" | grep -q 'SubmissionStatus.COMPLETE'; then
              echo 'terminal=COMPLETE' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if echo "$row" | grep -q 'SubmissionStatus.ERROR'; then
              echo 'terminal=ERROR' >> "$GITHUB_OUTPUT"
              exit 2
            fi
            sleep 20
          done
          echo 'terminal=PENDING_TIMEOUT' >> "$GITHUB_OUTPUT"
          exit 3
      - name: Post exact terminal result to issue 16
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SUBMIT_RC: ${{ steps.submit.outputs.rc }}
          TERMINAL: ${{ steps.poll.outputs.terminal }}
        run: |
          kaggle competitions submissions -c kaggriculture -v > /tmp/final.txt 2>&1 || true
          {
            echo '## V32.4 standalone Kaggle retry'
            echo
            echo '**File:** `kaggriculture_v32.4_standalone.py`'
            echo "**Upload rc:** \`${SUBMIT_RC:-unknown}\`"
            echo "**Terminal status:** \`${TERMINAL:-unknown}\`"
            echo
            echo '### Upload response'
            echo '```text'
            cat /tmp/submit.txt 2>/dev/null || true
            echo '```'
            echo '### Current matching row'
            echo '```text'
            grep 'V32.4 standalone surplus-land live test' /tmp/final.txt | head -1 || true
            echo '```'
          } > /tmp/result.md
          gh issue comment 16 --repo "$GITHUB_REPOSITORY" --body-file /tmp/result.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v32-4-standalone-live
          path: |
            dist/
            /tmp/before.txt
            /tmp/submit.txt
            /tmp/after.txt
            /tmp/final.txt
          if-no-files-found: ignore
          retention-days: 14
