name: V30 Kaggle Gate Check

# refreshed 2026-08-10 for full leaderboard/rank + quota
on:
  push:
    branches: [v30-economic-compounder]
    paths:
      - '.github/workflows/v30-kaggle-gate.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-24.04
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Kaggle CLI
        run: pip install -q kaggle
      - name: Query Kaggle
        run: |
          set -e
          test -n "$KAGGLE_API_TOKEN"
          kaggle competitions submissions kaggriculture --csv > /tmp/submissions.csv
          mkdir -p /tmp/lb
          kaggle competitions leaderboard kaggriculture -d -p /tmp/lb -q
          python - <<'PY'
          import csv, json
          from datetime import datetime, timezone
          from pathlib import Path

          now = datetime.now(timezone.utc)
          with open('/tmp/submissions.csv', newline='', encoding='utf-8-sig') as f:
              subs=list(csv.DictReader(f))

          def parse_date(r):
              for k in ('date','Date','submittedAt','submitted_at'):
                  v=r.get(k)
                  if not v: continue
                  for fmt in ('%Y-%m-%d %H:%M:%S.%f','%Y-%m-%d %H:%M:%S','%Y-%m-%dT%H:%M:%S.%fZ','%Y-%m-%dT%H:%M:%SZ'):
                      try: return datetime.strptime(v,fmt).replace(tzinfo=timezone.utc)
                      except Exception: pass
              return None

          today=[r for r in subs if (parse_date(r) and parse_date(r).date()==now.date())]
          hard_limit=5
          remaining=max(0,hard_limit-len(today))

          csvs=list(Path('/tmp/lb').glob('*.csv'))
          if not csvs:
              raise RuntimeError('Downloaded leaderboard CSV not found')
          lb_path=csvs[0]
          with lb_path.open(newline='',encoding='utf-8-sig') as f:
              lb=list(csv.DictReader(f))
          team_count=len(lb)
          target=None
          rank=None
          for i,row in enumerate(lb,1):
              name=(row.get('teamName') or row.get('TeamName') or row.get('team_name') or '').strip()
              if name.lower()=='gnr8tr':
                  target=row; rank=i; break
          payload={
              'utc_now':now.isoformat(),
              'submissions_today_utc':len(today),
              'hard_daily_limit':hard_limit,
              'remaining_today':remaining,
              'gate_open':remaining>0,
              'team_count':team_count,
              'gnr8tr_rank':rank,
              'gnr8tr_row':target,
              'recent_submissions':subs[:15],
              'leaderboard_file':lb_path.name,
          }
          Path('/tmp/gate.json').write_text(json.dumps(payload,indent=2,default=str))
          print(json.dumps(payload,indent=2,default=str))
          PY
      - name: Comment result on gate PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### V30 Kaggle gate check'
            echo
            echo '```json'
            cat /tmp/gate.json
            echo '```'
          } > /tmp/comment.md
          gh pr comment 15 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
