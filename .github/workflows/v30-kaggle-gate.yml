name: V30 Kaggle Gate Check

# refreshed 2026-08-10 for live rank/submission gate
on:
  push:
    branches: [v30-economic-compounder]
    paths:
      - '.github/workflows/v30-kaggle-gate.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-24.04
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Kaggle CLI
        run: pip install -q kaggle
      - name: Query Kaggle
        run: |
          set -e
          test -n "$KAGGLE_API_TOKEN"
          kaggle competitions list -s kaggriculture --csv > /tmp/competition.csv
          kaggle competitions submissions kaggriculture --csv > /tmp/submissions.csv
          kaggle competitions leaderboard kaggriculture -s -v > /tmp/leaderboard.txt 2>&1 || true
          python - <<'PY'
          import csv, json
          from datetime import datetime, timezone
          from pathlib import Path
          from kaggle.api.kaggle_api_extended import KaggleApi

          now = datetime.now(timezone.utc)
          api = KaggleApi(); api.authenticate()
          comp_dump = {}
          try:
              comp = api.competition_view('kaggriculture')
              comp_dump = comp.to_dict() if hasattr(comp, 'to_dict') else dict(getattr(comp, '__dict__', {}))
          except Exception as e:
              comp_dump = {'competition_view_error': repr(e)}

          rows=[]
          with open('/tmp/submissions.csv', newline='', encoding='utf-8-sig') as f:
              rows=list(csv.DictReader(f))

          def parse_date(r):
              for k in ('date','Date','submittedAt','submitted_at'):
                  v=r.get(k)
                  if not v: continue
                  for fmt in ('%Y-%m-%d %H:%M:%S.%f','%Y-%m-%d %H:%M:%S','%Y-%m-%dT%H:%M:%S.%fZ','%Y-%m-%dT%H:%M:%SZ'):
                      try: return datetime.strptime(v,fmt).replace(tzinfo=timezone.utc)
                      except Exception: pass
              return None

          today=[r for r in rows if (parse_date(r) and parse_date(r).date()==now.date())]
          # Competition hard limit is 5/day for this competition; competition_view currently omits it.
          hard_limit=5
          remaining=max(0, hard_limit-len(today))
          lb=Path('/tmp/leaderboard.txt').read_text(errors='replace')
          lines=[x for x in lb.splitlines() if x.strip()]
          gnr=[x for x in lines if ',Gnr8tr,' in x or ',gnr8tr,' in x.lower()]
          payload={
              'utc_now':now.isoformat(),
              'submissions_today_utc':len(today),
              'hard_daily_limit':hard_limit,
              'remaining_today':remaining,
              'gate_open':remaining>0,
              'recent_submissions':rows[:15],
              'gnr8tr_leaderboard_rows':gnr,
              'leaderboard_tail':lb[-12000:],
          }
          Path('/tmp/gate.json').write_text(json.dumps(payload,indent=2,default=str))
          print(json.dumps(payload,indent=2,default=str))
          PY
      - name: Comment result on gate PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### V30 Kaggle gate check'
            echo
            echo '```json'
            cat /tmp/gate.json
            echo '```'
          } > /tmp/comment.md
          gh pr comment 15 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
