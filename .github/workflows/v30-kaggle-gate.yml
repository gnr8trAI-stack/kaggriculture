name: V30 Kaggle Gate Check

# refreshed 2026-08-10 for authenticated userRank/teamCount + quota
on:
  push:
    branches: [v30-economic-compounder]
    paths:
      - '.github/workflows/v30-kaggle-gate.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-24.04
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Kaggle CLI
        run: pip install -q kaggle
      - name: Query Kaggle
        run: |
          set -e
          test -n "$KAGGLE_API_TOKEN"
          kaggle competitions submissions kaggriculture --csv > /tmp/submissions.csv
          kaggle competitions list --group entered -v > /tmp/entered.csv
          python - <<'PY'
          import csv, json
          from datetime import datetime, timezone
          from pathlib import Path

          now=datetime.now(timezone.utc)
          with open('/tmp/submissions.csv',newline='',encoding='utf-8-sig') as f:
              subs=list(csv.DictReader(f))
          with open('/tmp/entered.csv',newline='',encoding='utf-8-sig') as f:
              entered=list(csv.DictReader(f))
          comp=next((r for r in entered if any('kaggriculture' in str(v).lower() for v in r.values())),{})

          def field(row,*names):
              low={str(k).lower():v for k,v in row.items()}
              for name in names:
                  if name.lower() in low:return low[name.lower()]
              return None
          def parse_date(r):
              for k in ('date','Date','submittedAt','submitted_at'):
                  v=r.get(k)
                  if not v: continue
                  for fmt in ('%Y-%m-%d %H:%M:%S.%f','%Y-%m-%d %H:%M:%S','%Y-%m-%dT%H:%M:%S.%fZ','%Y-%m-%dT%H:%M:%SZ'):
                      try:return datetime.strptime(v,fmt).replace(tzinfo=timezone.utc)
                      except Exception:pass
              return None
          today=[r for r in subs if parse_date(r) and parse_date(r).date()==now.date()]
          hard_limit=5
          payload={
              'utc_now':now.isoformat(),
              'gnr8tr_rank':int(field(comp,'userRank','user_rank') or 0),
              'team_count':int(field(comp,'teamCount','team_count') or 0),
              'competition_row':comp,
              'entered_rows':entered,
              'submissions_today_utc':len(today),
              'hard_daily_limit':hard_limit,
              'remaining_today':max(0,hard_limit-len(today)),
              'gate_open':len(today)<hard_limit,
              'recent_submissions':subs[:15],
          }
          Path('/tmp/gate.json').write_text(json.dumps(payload,indent=2,default=str))
          print(json.dumps(payload,indent=2,default=str))
          PY
      - name: Comment result on gate PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### V30 Kaggle gate check'
            echo
            echo '```json'
            cat /tmp/gate.json
            echo '```'
          } > /tmp/comment.md
          gh pr comment 15 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
