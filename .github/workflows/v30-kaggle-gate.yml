name: V30 Kaggle Gate Check

on:
  push:
    branches: [v30-economic-compounder]
    paths:
      - '.github/workflows/v30-kaggle-gate.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-24.04
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Kaggle CLI
        run: pip install -q kaggle
      - name: Verify auth
        run: |
          test -n "$KAGGLE_API_TOKEN"
          kaggle competitions list -s kaggriculture --csv
      - name: Current submissions
        run: |
          echo '=== SUBMISSIONS_VERBOSE ==='
          kaggle competitions submissions kaggriculture -v || true
          echo '=== SUBMISSIONS_CSV ==='
          kaggle competitions submissions kaggriculture --csv || true
      - name: Current leaderboard
        run: |
          echo '=== LEADERBOARD ==='
          kaggle competitions leaderboard kaggriculture -s -v || kaggle competitions leaderboard kaggriculture -s || true
      - name: UTC clock
        run: date -u '+UTC_NOW=%Y-%m-%dT%H:%M:%SZ'
