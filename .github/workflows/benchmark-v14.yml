name: benchmark-v14

on:
  pull_request:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare output directories
        run: mkdir -p dist experiments
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run V14 focused tests
        run: pytest -q tests/test_v14_integrated_farm.py
      - name: Build standalone submission
        run: |
          python scripts/build_v14_submission.py
          python -m py_compile dist/submission.py
          test -s dist/submission.py
          ! grep -Eq 'from agents|import agents|from scripts|import scripts' dist/submission.py
      - name: Run population benchmark with telemetry
        run: >-
          python scripts/benchmark_v14.py
          --games-per-seat 10
          --seed-start 100000
          --output experiments/v14-benchmark.json
          --telemetry-output experiments/v14-telemetry.jsonl
      - name: Compress telemetry
        if: always()
        run: gzip -9 -f experiments/v14-telemetry.jsonl || true
      - name: Upload V14 package
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v14-integrated-farm-benchmark
          path: |
            experiments/v14-benchmark.json
            experiments/v14-telemetry.jsonl.gz
            dist/submission.py
          if-no-files-found: warn
          retention-days: 90
